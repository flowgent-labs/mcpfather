# -- Number of replicas
replicaCount: 1

image:
  repository: __BINARY_NAME__
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations:
    # GCP Workload Identity — bind a GCP service account to the k8s SA.
    # iam.gke.io/gcp-service-account: __BINARY_NAME__-mcp-sa@PROJECT_ID.iam.gserviceaccount.com
  name: ""

podAnnotations: {}
podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  port: 8080
  mgmtPort: 9991

ingress:
  nginx:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: __BINARY_NAME__.local
        paths:
          - path: /
            pathType: Prefix
    tls: []
  envoy:
    enabled: false
    gatewayClassName: "envoy-gateway"
    gatewayPort: 80
    hosts:
      - host: __BINARY_NAME__.local
        paths:
          - path: /
            pathType: Prefix
    tls: []

# -- Resource requests/limits for the MCP server pod
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

# -- Horizontal Pod Autoscaler
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

# -- Secret injection mechanism for auth credentials.
#   provider: "static" = native k8s Secret (secret.static.create controls creation).
#   provider: "gcp"    = GCP Secret Manager via CSI driver (requires GKE + SecretProviderClass).
secret:
  provider: "static"
  static:
    # -- Create the k8s Secret from the values below.
    create: false
    # -- Name of an externally-managed k8s Secret (only used when create is false).
    externalName: ""
    annotations: {}
    # -- Static bearer token for upstream API auth.
    webToken: ""
    # -- Static cookie for upstream API auth.
    cookieToken: ""
    # -- OIDC client secret (used with config.upstream.default.auth.oidc).
    oidcClientSecret: ""
  gcp:
    # -- GCP project ID where the Secret Manager secret lives.
    projectId: ""
    # -- Secret Manager secret ID (the secret resource name, not the full path).
    secretId: ""
    # -- Path to the GCP service account key file (mounted via k8s Secret).
    # Set to empty string to rely on Workload Identity.
    credentialsFile: ""

# -- MCP server configuration (mounted as ConfigMap)
config:
  # ---- Server (inbound) ----
  server:
    auth:
      oidc:
        enabled: false
        issuer: ""
        jwksUri: ""
        # -- Expected JWT "aud" claim; also published as the RFC 9728
        # protected-resource identifier at /.well-known/oauth-protected-resource.
        audience: ""
        # -- When true, validated frontend JWT claims (sub, email) are forwarded
        # upstream as X-MCP-Client-Token-Sub and X-MCP-Client-Token-Email headers.
        enable_client_token_claim_forward: true
        # -- Additional JWT claims to forward as X-MCP-Client-Token-<Header-Name> headers.
        # e.g. ["given_name", "family_name", "preferred_username"]
        additional_client_token_claim_forward: []
    # -- Internal File System (IFS) REST API for binary file transfer.
    ifs:
      enabled: true
    # -- HTTP server timeouts in seconds. 0 = disabled.
    # write_timeout_seconds must be 0 for SSE (Streamable HTTP) transport.
    read_timeout_seconds: 30
    write_timeout_seconds: 0
    idle_timeout_seconds: 120

  # ---- Logging ----
  logging:
    level: 0                  # 0-10 (0=silent, 10=full debug)
    auth_verbose: false       # set true to print Authorization/Cookie header values

  # ---- Management ----
  mgmt:
    enabled: true
    host: "0.0.0.0"
    port: 9991
    pprof:
      enabled: false
      server_bind: "0.0.0.0:6669"
    otel:
      enabled: false
      endpoint: ""
      protocol: "grpc"
      timeout: 10000
      sample_rate: 1.0
    metrics:
      enabled: true
      prometheus: true
      export_interval: "30s"
      histogram_boundaries:
        task: [0.005, 0.01, 0.025, 0.05, 0.1, 0.25, 0.5, 1, 2.5, 5, 10, 30, 60, 120]
      labels: {}

  # ---- Upstream (outbound) ----
  upstream:
    default:
      endpoint: ""
      enable_mcp_session_forward: true
      auth:
        # -- OIDC client credentials flow (machine-to-machine).
        oidc:
          enabled: false
          issuer: ""
          client_id: ""
          client_secret: ""
          scopes: "openid"
          token_url: ""
        static:
          web_token: ""
          web_token_file: ""
          cookie_token: ""
          cookie_token_file: ""

  # ---- Native MCP Tools ----
  native_tools:
    expose:
      register_all_tools_by_default: false
      includes: []
      excludes: []

  # ---- Virtual Tools ----
  # Compose multiple native tools into a single virtual tool via a declarative
  # pipeline (call → jq → foreach → emit → return).
  # Each virtual tool has: name, description, input_schema, and pipeline.
  virtual_tools: []
  # Example:
  # virtual_tools:
  #   - name: my_virtual_tool
  #     description: Chain multiple tool calls
  #     input_schema:
  #       type: object
  #       properties:
  #         name:
  #           type: string
  #       required:
  #         - name
  #     pipeline:
  #       - id: step1
  #         kind: call
  #         spec:
  #           tool: SomeTool
  #           args: {}
  #       - id: done
  #         kind: return
  #         spec:
  #           from: $step1

# -- Persistence (PVC) for download files / cache.
# Set storageClassName for cloud CSI drivers:
#   GCP: standard-rwo
#   AWS: gp3
persistence:
  enabled: false
  storageClassName: ""
  size: 1Gi
  accessMode: ReadWriteOnce
  annotations: {}

# -- Node selector for pod assignment
nodeSelector: {}

# -- Tolerations for pod assignment
tolerations: []

# -- Affinity for pod assignment
affinity: {}
