{{- if (include "__MCP_SERVER_NAME__.useGCPSecret" .) }}
{{- $projectID := required "secret.gcp.projectId is required when provider is gcp" .Values.secret.gcp.projectId -}}
{{- $oidcSecretID := default .Values.secret.gcp.secretId .Values.secret.gcp.oidcClientSecretId -}}
{{- $webSecretID := default .Values.secret.gcp.secretId .Values.secret.gcp.webTokenSecretId -}}
{{- $cookieSecretID := default .Values.secret.gcp.secretId .Values.secret.gcp.cookieTokenSecretId -}}
{{- if not (or $oidcSecretID $webSecretID $cookieSecretID) -}}
{{- fail "secret.gcp.secretId or at least one of oidcClientSecretId/webTokenSecretId/cookieTokenSecretId is required when provider is gcp" -}}
{{- end }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "__MCP_SERVER_NAME__.fullname" . }}-spc
  labels:
    {{- include "__MCP_SERVER_NAME__.labels" . | nindent 4 }}
spec:
  provider: {{ .Values.secret.gcp.providerName | quote }}
  parameters:
    secrets: |
      {{- if $oidcSecretID }}
      - resourceName: "projects/{{ $projectID }}/secrets/{{ $oidcSecretID }}/versions/latest"
        path: "oidc_client_secret"
      {{- end }}
      {{- if $webSecretID }}
      - resourceName: "projects/{{ $projectID }}/secrets/{{ $webSecretID }}/versions/latest"
        path: "web_token"
      {{- end }}
      {{- if $cookieSecretID }}
      - resourceName: "projects/{{ $projectID }}/secrets/{{ $cookieSecretID }}/versions/latest"
        path: "cookie_token"
      {{- end }}
{{- end }}
