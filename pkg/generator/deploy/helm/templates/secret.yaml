{{- if (include "__MCP_SERVER_NAME__.useStaticSecret" .) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "__MCP_SERVER_NAME__.fullname" . }}-secret
  labels:
    {{- include "__MCP_SERVER_NAME__.labels" . | nindent 4 }}
  {{- with .Values.secret.static.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  oidc_client_secret: {{ .Values.secret.static.oidcClientSecret | quote }}
  oidc_password: {{ .Values.secret.static.oidcPassword | quote }}
  web_token: {{ .Values.secret.static.webToken | quote }}
  cookie_token: {{ .Values.secret.static.cookieToken | quote }}
{{- end }}
