apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "__BINARY_NAME__.fullname" . }}
  labels:
    {{- include "__BINARY_NAME__.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "__BINARY_NAME__.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "__BINARY_NAME__.labels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "__BINARY_NAME__.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ include "__BINARY_NAME__.name" . }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
            - name: mgmt
              containerPort: {{ .Values.service.mgmtPort }}
              protocol: TCP
          env:
            - name: HOME
              value: "/home/mcp"
            - name: MCP__UPSTREAM__DEFAULT__ENDPOINT
              value: {{ .Values.config.upstream.default.endpoint | quote }}
            {{- if .Values.config.server.auth.oidc.enabled }}
            - name: MCP__SERVER__AUTH__OIDC__ENABLED
              value: "true"
            - name: MCP__SERVER__AUTH__OIDC__ISSUER
              value: {{ .Values.config.server.auth.oidc.issuer | quote }}
            {{- if .Values.config.server.auth.oidc.jwksUri }}
            - name: MCP__SERVER__AUTH__OIDC__JWKS_URI
              value: {{ .Values.config.server.auth.oidc.jwksUri | quote }}
            {{- end }}
            - name: MCP__SERVER__AUTH__OIDC__AUDIENCE
              value: {{ .Values.config.server.auth.oidc.audience | quote }}
            - name: MCP__SERVER__AUTH__OIDC__ENABLE_CLIENT_TOKEN_CLAIM_FORWARD
              value: {{ .Values.config.server.auth.oidc.enableClientTokenClaimForward | quote }}
            {{- if .Values.config.server.auth.oidc.additionalClientTokenClaimForward }}
            - name: MCP__SERVER__AUTH__OIDC__ADDITIONAL_CLIENT_TOKEN_CLAIM_FORWARD
              value: {{ join "," .Values.config.server.auth.oidc.additionalClientTokenClaimForward | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.config.upstream.default.auth.oidc.enabled }}
            - name: MCP__UPSTREAM__DEFAULT__AUTH__OIDC__ENABLED
              value: "true"
            - name: MCP__UPSTREAM__DEFAULT__AUTH__OIDC__ISSUER
              value: {{ .Values.config.upstream.default.auth.oidc.issuer | quote }}
            - name: MCP__UPSTREAM__DEFAULT__AUTH__OIDC__CLIENT_ID
              value: {{ .Values.config.upstream.default.auth.oidc.clientId | quote }}
            - name: MCP__UPSTREAM__DEFAULT__AUTH__OIDC__SCOPES
              value: {{ .Values.config.upstream.default.auth.oidc.scopes | quote }}
            {{- if .Values.config.upstream.default.auth.oidc.tokenUrl }}
            - name: MCP__UPSTREAM__DEFAULT__AUTH__OIDC__TOKEN_URL
              value: {{ .Values.config.upstream.default.auth.oidc.tokenUrl | quote }}
            {{- end }}
            {{- if .Values.secret.static.create }}
            - name: MCP__UPSTREAM__DEFAULT__AUTH__OIDC__CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "__BINARY_NAME__.secretName" . }}
                  key: oidc_client_secret
            {{- end }}
            {{- end }}
            {{- if and .Values.secret.static.create (eq .Values.secret.provider "static") }}
            {{- if .Values.secret.static.webToken }}
            - name: MCP__UPSTREAM__DEFAULT__AUTH__STATIC__WEB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "__BINARY_NAME__.secretName" . }}
                  key: web_token
            {{- end }}
            {{- if .Values.secret.static.cookieToken }}
            - name: MCP__UPSTREAM__DEFAULT__AUTH__STATIC__COOKIE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "__BINARY_NAME__.secretName" . }}
                  key: cookie_token
            {{- end }}
            {{- else if and (eq .Values.secret.provider "gcp") }}
            {{- if .Values.secret.static.webToken }}
            - name: MCP__UPSTREAM__DEFAULT__AUTH__STATIC__WEB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "__BINARY_NAME__.secretName" . }}
                  key: web_token
            {{- end }}
            {{- if .Values.secret.static.cookieToken }}
            - name: MCP__UPSTREAM__DEFAULT__AUTH__STATIC__COOKIE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "__BINARY_NAME__.secretName" . }}
                  key: cookie_token
            {{- end }}
            {{- end }}
            - name: MCP__LOGGING__AUTH_VERBOSE
              value: {{ .Values.config.logging.auth_verbose | quote }}
          {{- if .Values.config.mgmt.otel.enabled }}
            - name: MCP__MGMT__OTEL__ENABLED
              value: "true"
            - name: MCP__MGMT__OTEL__ENDPOINT
              value: {{ .Values.config.mgmt.otel.endpoint | quote }}
            - name: MCP__MGMT__OTEL__PROTOCOL
              value: {{ .Values.config.mgmt.otel.protocol | quote }}
            - name: MCP__MGMT__OTEL__SAMPLE_RATE
              value: {{ .Values.config.mgmt.otel.sampleRate | quote }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: mgmt
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: mgmt
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /home/mcp/.__BINARY_NAME__/config.yaml
              subPath: config.yaml
            {{- if eq .Values.secret.provider "gcp" }}
            - name: secrets
              mountPath: /mnt/secrets
              readOnly: true
            {{- end }}
            {{- if .Values.persistence.enabled }}
            - name: data
              mountPath: /home/mcp/downloads
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "__BINARY_NAME__.fullname" . }}-config
        {{- if eq .Values.secret.provider "gcp" }}
        - name: secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ include "__BINARY_NAME__.fullname" . }}-spc
        {{- end }}
        {{- if .Values.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "__BINARY_NAME__.fullname" . }}-data
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
