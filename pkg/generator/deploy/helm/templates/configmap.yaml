apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "__BINARY_NAME__.fullname" . }}-config
  labels:
    {{- include "__BINARY_NAME__.labels" . | nindent 4 }}
data:
  config.yaml: |
    # MCP server configuration — generated by mcpfather

    # ---- Server (inbound) ----
    server:
      auth:
        oidc:
          enabled: {{ .Values.config.server.auth.oidc.enabled }}
          issuer: {{ .Values.config.server.auth.oidc.issuer | quote }}
          jwks_uri: {{ .Values.config.server.auth.oidc.jwksUri | quote }}
          audience: {{ .Values.config.server.auth.oidc.audience | quote }}
          enable_client_token_claim_forward: {{ .Values.config.server.auth.oidc.enable_client_token_claim_forward }}
          additional_client_token_claim_forward:
            {{- range .Values.config.server.auth.oidc.additional_client_token_claim_forward }}
            - {{ . | quote }}
            {{- end }}
      ifs:
        enabled: {{ .Values.config.server.ifs.enabled }}
      read_timeout_seconds: {{ .Values.config.server.read_timeout_seconds }}
      write_timeout_seconds: {{ .Values.config.server.write_timeout_seconds }}
      idle_timeout_seconds: {{ .Values.config.server.idle_timeout_seconds }}

    # ---- Logging ----
    logging:
      level: {{ .Values.config.logging.level }}
      auth_verbose: {{ .Values.config.logging.auth_verbose }}

    # ---- Management ----
    mgmt:
      enabled: {{ .Values.config.mgmt.enabled }}
      host: {{ .Values.config.mgmt.host | quote }}
      port: {{ .Values.service.mgmtPort }}
      pprof:
        enabled: {{ .Values.config.mgmt.pprof.enabled }}
        server_bind: {{ .Values.config.mgmt.pprof.server_bind | quote }}
      otel:
        enabled: {{ .Values.config.mgmt.otel.enabled }}
        endpoint: {{ .Values.config.mgmt.otel.endpoint | quote }}
        protocol: {{ .Values.config.mgmt.otel.protocol | quote }}
        timeout: {{ .Values.config.mgmt.otel.timeout }}
        sample_rate: {{ .Values.config.mgmt.otel.sample_rate }}
      metrics:
        enabled: {{ .Values.config.mgmt.metrics.enabled }}
        prometheus: {{ .Values.config.mgmt.metrics.prometheus }}
        export_interval: {{ .Values.config.mgmt.metrics.export_interval | quote }}
        histogram_boundaries:
          task: {{ .Values.config.mgmt.metrics.histogram_boundaries.task | toJson }}
        labels: {{ .Values.config.mgmt.metrics.labels | toJson }}

    # ---- Upstream (outbound) ----
    upstream:
      default:
        endpoint: {{ .Values.config.upstream.default.endpoint | quote }}
        enable_mcp_session_forward: {{ .Values.config.upstream.default.enable_mcp_session_forward }}
        auth:
          oidc:
            enabled: {{ .Values.config.upstream.default.auth.oidc.enabled }}
            issuer: {{ .Values.config.upstream.default.auth.oidc.issuer | quote }}
            client_id: {{ .Values.config.upstream.default.auth.oidc.client_id | quote }}
            scopes: {{ .Values.config.upstream.default.auth.oidc.scopes | quote }}
            token_url: {{ .Values.config.upstream.default.auth.oidc.token_url | quote }}
            client_secret: ""   # set via MCP__UPSTREAM__DEFAULT__AUTH__OIDC__CLIENT_SECRET env (from Secret)
          static:
            web_token: ""       # set via MCP__UPSTREAM__DEFAULT__AUTH__STATIC__WEB_TOKEN env (from Secret)
            web_token_file: ""
            cookie_token: ""    # set via MCP__UPSTREAM__DEFAULT__AUTH__STATIC__COOKIE_TOKEN env (from Secret)
            cookie_token_file: ""

    # ---- Native MCP Tools ----
    native_tools:
      expose:
        register_all_tools_by_default: {{ .Values.config.native_tools.expose.register_all_tools_by_default }}
        includes:
          {{- range .Values.config.native_tools.expose.includes }}
          - {{ . | quote }}
          {{- end }}
        excludes:
          {{- range .Values.config.native_tools.expose.excludes }}
          - {{ . | quote }}
          {{- end }}

    # ---- Virtual Tools ----
    virtual_tools:
        {{- toYaml .Values.config.virtual_tools | nindent 6 }}
