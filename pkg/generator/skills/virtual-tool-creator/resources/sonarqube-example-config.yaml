# ---- Frontend / Backend ----
# frontend = inbound: validates bearer tokens presented by MCP clients (AI agents).
# backend  = outbound: upstream API endpoints the server calls, keyed by name.
# The two are decoupled — the inbound token is never reused outbound.

# ---- Frontend (inbound auth) ----
server:
  # Override the default service name (derived from the binary name).
  # Affects filesystem paths and OpenTelemetry service.name.

  # Maximum number of concurrent AI agent client MCP requests.
  # HTTP server timeouts in seconds. 0 = disabled.
  # write_timeout_seconds must be 0 for SSE (Streamable HTTP) transport.
  read_timeout_seconds: 30
  write_timeout_seconds: 0
  idle_timeout_seconds: 120
  auth:
    # Standard OAuth 2.1 / OIDC JWT bearer validation (Resource Server role, RFC 9728).
    # Only enforced on the http transport; stdio has no network boundary.
    oidc:
      enabled: false
      issuer: ""            # e.g. https://idp.example.com/realms/myrealm
      jwks_uri: ""          # optional override (auto-discovered from issuer if empty)
      audience: ""          # expected JWT "aud" claim; also published as the RFC 9728 protected-resource identifier
      # When true, validated frontend JWT claims (sub, email) are forwarded upstream
      # as X-MCP-Client-Token-Sub and X-MCP-Client-Token-Email headers.
      enable_client_token_claim_forward: true
      # Additional JWT claims to forward as X-MCP-Client-Token-<Header-Name> headers.
      # e.g. ["given_name", "family_name", "preferred_username"]
      # additional_client_token_claim_forward: []
  # ---- Temporary File System (TFS) Data Plane ----
  # Built-in REST API for binary file transfer, separate from the
  # JSON-RPC 2.0 control plane at /mcp.
  # Upload:   POST /_/tfs/upload/{uuid}
  # Download: GET  /_/tfs/download/{uuid}
  # Files stored under ~/.<app>/tfs/{download,upload}/
  # with UUID-based filenames to prevent collisions.
  tfs:
    enabled: true
    # Public base URI used to build returned TFS download URLs.
    # Empty means auto-detect from the inbound /mcp request Host/X-Forwarded-* headers.
    base_uri: ""
    # Completed temporary files older than this are removed by the background clean job.
    clean-job-ttl-seconds: "5m"

# ---- Logging ----
logging:
  # Controls server-side request/response logging verbosity.
  # Priority for level: -v CLI flag > MCP__LOGGING__LEVEL ENV > logging.level in config.yaml
  level: 0                      # 0-10 (0=silent, 1-3=access, 4-7=+headers, 8-9=+values, 10=+body)
  auth_verbose: false           # set true to print Authorization/Cookie header values in logs

# ---- Management Endpoints (metrics, tracing, pprof) ----
mgmt:
  enabled: true
  host: 0.0.0.0
  port: 9991
  pprof:
    enabled: false
    server_bind: 0.0.0.0:6669
  otel:
    enabled: false
    endpoint: localhost:4317
    protocol: grpc             # grpc | http/protobuf | http/json
    timeout: 10000             # connection timeout in milliseconds
    sample_rate: 1.0           # 0.0–1.0 trace sampling ratio
  metrics:
    enabled: true
    prometheus: true
    export_interval: 30s
    histogram_boundaries:
      task: [0.005, 0.01, 0.025, 0.05, 0.1, 0.25, 0.5, 1, 2.5, 5, 10, 30, 60, 120]
    labels: {}                 # static labels added to every metric

# ---- Backend (outbound upstream) ----
upstream:
  default:
    endpoint: ""               # primary upstream API base URL (e.g. https://api.example.com)
    # When true, the MCP session ID is forwarded as X-MCP-Session-ID header.
    enable_mcp_session_forward: true
    auth:
      # OIDC client credentials flow (machine-to-machine)
      oidc:
        enabled: false
        issuer: ""            # e.g. https://keycloak.example.com/realms/myrealm
        client_id: ""
        client_secret: ""
        scopes: "openid"       # space-separated scope list
        token_url: ""          # optional override (auto-discovered from issuer if empty)

      # Static credentials for legacy / simple APIs
      static:
        web_token: ""       # static Bearer token
        web_token_file: ""   # path to file containing bearer token (K8s secrets)
        cookie_token: ""        # static cookie (e.g. JSESSIONID for legacy systems)
        cookie_token_file: ""   # path to file containing cookie token (K8s secrets)

  # Additional named backends referenced by http pipeline steps.
  # sonarqube:
  #   endpoint: https://sonarqube.example.com
  #   enable_mcp_session_forward: true
  #   auth:
  #     static:
  #       web_token: ""       # static Bearer token for this upstream
  #       cookie_token: ""    # static cookie token for this upstream

# ---- Native MCP Tools ----
native_tools:
  expose:
    # When true, all native tools are registered by default
    # (individual tools can be hidden via excludes).
    # When false (the default), only tools listed in includes
    # are exposed.
    register_all_tools_by_default: false

    # Explicitly expose these tools (operationId values).
    # Takes precedence: tools listed here are always exposed,
    # even if register_all_tools_by_default is false.
    includes:
      - GetIssuesList
      - GetIssuesSearch
      - GetSourcesIssueSnippets
      - GetComponentsShow
      - GetProjectsExportFindings
      - GetQualityProfilesSearch
      - GetQualityProfilesShow

    # Explicitly hide these tools from external agents (operationId values).
    # Takes precedence over register_all_tools_by_default.
    # A tool listed in BOTH includes and excludes will cause
    # the server to fail at startup.
    excludes: []

# ---- Virtual Tools ----
# Compose multiple native tools into a single virtual tool via a declarative
# e.g: 5-step pipeline (call → jq → foreach → emit → return).
# Schema: https://github.com/flowgent-labs/mcpfather/blob/main/.agents/skills/virtual-tool-creator/resources/dsl-schema.json
virtual_tools:
  # ---- get_newcode_issues ---------------------------------------------------
  - name: get_newcode_issues
    enabled: true
    description: |
      Get compact PR new-code findings for AI agents: Sonar issues, uncovered
      source lines and conditions, plus duplication metrics by file.
    input_schema:
      type: object
      required: [projectKey, branch, pullRequest]
      properties:
        projectKey:
          type: string
          description: SonarQube project key (e.g., rengine).
        branch:
          type: string
          description: Git branch name (e.g., main).
        pullRequest:
          type: string
          description: Pull request ID.
        component:
          type: string
          default: ""
          description: Optional file path filter. Full SonarQube component key (e.g., "rengine:src/main/java/Foo.java") or relative path under project.
        limit:
          type: integer
          default: 500
          minimum: 1
          maximum: 500
          description: SonarQube API page size used while retrieving all PR issues.
        coveragePageSize:
          type: integer
          default: 500
          minimum: 1
          maximum: 500
          description: SonarQube API page size used while retrieving PR coverage components.
        sourceLineLimit:
          type: integer
          default: 20000
          minimum: 1
          maximum: 50000
          description: Maximum source line number to request per uncovered file.
        snippetConcurrency:
          type: integer
          default: 6
          minimum: 1
          maximum: 16
    pipeline:
      - id: opts
        kind: jq
        spec:
          from: $input
          expr: |
            {
              scope: (if (.component // "") != "" then .component else .projectKey end),
              limit: (.limit // 500),
              coveragePageSize: (.coveragePageSize // 500),
              sourceLineLimit: (.sourceLineLimit // 20000),
              snippetConcurrency: (.snippetConcurrency // 6)
            }
      - id: issueSeed
        kind: http
        spec:
          upstream: default
          method: GET
          path: /api/issues/search
          parse: json
          query:
            componentKeys: $opts.scope
            pullRequest: $input.pullRequest
            types: "CODE_SMELL,BUG,VULNERABILITY"
            resolved: "false"
            additionalFields: "_all"
            s: "FILE_LINE"
            asc: "true"
            ps: 1
            p: 1
        require:
          field: "issues"
          message: No issues found for the given project, branch and pull request.
      - id: issuePageNumbers
        kind: jq
        spec:
          from: $issueSeed
          vars:
            pageSize: $opts.limit
          expr: |
            [range(1; ((((.total // 0) / $pageSize) | ceil) + 1))]
      - id: issuePages
        kind: foreach
        spec:
          in: $issuePageNumbers
          as: page
          onMissing: skip
          concurrency: 4
          preserveOrder: true
          pipeline:
            - id: issuePage
              kind: http
              spec:
                upstream: default
                method: GET
                path: /api/issues/search
                parse: json
                query:
                  componentKeys: $opts.scope
                  pullRequest: $input.pullRequest
                  types: "CODE_SMELL,BUG,VULNERABILITY"
                  resolved: "false"
                  additionalFields: "_all"
                  s: "FILE_LINE"
                  asc: "true"
                  ps: $opts.limit
                  p: $page
            - id: emitIssuePage
              kind: emit
              spec:
                from: $issuePage
      - id: rawIssues
        kind: jq
        spec:
          from: $issuePages
          vars:
            seed: $issueSeed
          expr: |
            {
              total: ($seed.total // 0),
              issues: [.[] | .issues[]?]
            }
      - id: coverageSeed
        kind: http
        spec:
          upstream: default
          method: GET
          path: /api/measures/component_tree
          parse: json
          query:
            component: $opts.scope
            pullRequest: $input.pullRequest
            metricKeys: "new_coverage,new_lines_to_cover,new_uncovered_lines,new_line_coverage,new_conditions_to_cover,new_uncovered_conditions"
            strategy: leaves
            qualifiers: FIL
            s: metric
            metricSort: new_coverage
            metricSortFilter: withMeasuresOnly
            asc: "true"
            ps: 1
            p: 1
      - id: coveragePageNumbers
        kind: jq
        spec:
          from: $coverageSeed
          vars:
            pageSize: $opts.coveragePageSize
          expr: |
            [range(1; (((((.paging.total // 0) / $pageSize) | ceil) + 1)))]
      - id: coveragePages
        kind: foreach
        spec:
          in: $coveragePageNumbers
          as: page
          onMissing: skip
          concurrency: 4
          preserveOrder: true
          pipeline:
            - id: coveragePage
              kind: http
              spec:
                upstream: default
                method: GET
                path: /api/measures/component_tree
                parse: json
                query:
                  component: $opts.scope
                  pullRequest: $input.pullRequest
                  metricKeys: "new_coverage,new_lines_to_cover,new_uncovered_lines,new_line_coverage,new_conditions_to_cover,new_uncovered_conditions"
                  strategy: leaves
                  qualifiers: FIL
                  s: metric
                  metricSort: new_coverage
                  metricSortFilter: withMeasuresOnly
                  asc: "true"
                  ps: $opts.coveragePageSize
                  p: $page
            - id: emitCoveragePage
              kind: emit
              spec:
                from: $coveragePage
      - id: coverage
        kind: jq
        spec:
          from: $coveragePages
          vars:
            seed: $coverageSeed
          expr: |
            {
              baseComponent: ($seed.baseComponent // null),
              total: ($seed.paging.total // 0),
              components: [
                .[] | .components[]?
                | (.measures // [] | map({
                    metric,
                    value: (.value // .period.value // (.periods[0].value? // null)),
                    bestValue: (.bestValue // .period.bestValue // (.periods[0].bestValue? // null)),
                    period: (.period // null),
                    periods: (.periods // [])
                  })) as $measures
                | {
                    key,
                    name,
                    qualifier,
                    path: (.path // null),
                    language: (.language // null),
                    newCoverage: (first($measures[]? | select(.metric == "new_coverage") | .value) // null),
                    newLineCoverage: (first($measures[]? | select(.metric == "new_line_coverage") | .value) // null),
                    newLinesToCover: (first($measures[]? | select(.metric == "new_lines_to_cover") | .value) // null),
                    newUncoveredLines: (first($measures[]? | select(.metric == "new_uncovered_lines") | .value) // null),
                    newConditionsToCover: (first($measures[]? | select(.metric == "new_conditions_to_cover") | .value) // null),
                    newUncoveredConditions: (first($measures[]? | select(.metric == "new_uncovered_conditions") | .value) // null),
                    measures: $measures
                  }
              ]
            }
      - id: duplicateSeed
        kind: http
        spec:
          upstream: default
          method: GET
          path: /api/measures/component_tree
          parse: json
          query:
            component: $opts.scope
            pullRequest: $input.pullRequest
            metricKeys: "new_duplicated_lines_density,new_duplicated_lines,new_duplicated_blocks"
            strategy: leaves
            qualifiers: FIL
            s: metric
            metricSort: new_duplicated_lines_density
            metricSortFilter: withMeasuresOnly
            asc: "false"
            ps: 1
            p: 1
      - id: duplicatePageNumbers
        kind: jq
        spec:
          from: $duplicateSeed
          vars:
            pageSize: $opts.coveragePageSize
          expr: |
            [range(1; (((((.paging.total // 0) / $pageSize) | ceil) + 1)))]
      - id: duplicatePages
        kind: foreach
        spec:
          in: $duplicatePageNumbers
          as: page
          onMissing: skip
          concurrency: 4
          preserveOrder: true
          pipeline:
            - id: duplicatePage
              kind: http
              spec:
                upstream: default
                method: GET
                path: /api/measures/component_tree
                parse: json
                query:
                  component: $opts.scope
                  pullRequest: $input.pullRequest
                  metricKeys: "new_duplicated_lines_density,new_duplicated_lines,new_duplicated_blocks"
                  strategy: leaves
                  qualifiers: FIL
                  s: metric
                  metricSort: new_duplicated_lines_density
                  metricSortFilter: withMeasuresOnly
                  asc: "false"
                  ps: $opts.coveragePageSize
                  p: $page
            - id: emitDuplicatePage
              kind: emit
              spec:
                from: $duplicatePage
      - id: duplicateMetrics
        kind: jq
        spec:
          from: $duplicatePages
          vars:
            seed: $duplicateSeed
          expr: |
            {
              total: ($seed.paging.total // 0),
              files: [
                .[] | .components[]?
                | (.measures // [] | map({
                    metric,
                    value: (.value // .period.value // (.periods[0].value? // null))
                  })) as $measures
                | {
                    key,
                    path: (.path // null),
                    density: (first($measures[]? | select(.metric == "new_duplicated_lines_density") | .value) // null),
                    lines: (first($measures[]? | select(.metric == "new_duplicated_lines") | .value) // null),
                    blocks: (first($measures[]? | select(.metric == "new_duplicated_blocks") | .value) // null)
                  }
                | select(((((.density // "0") | tonumber?) // 0) > 0) or ((((.lines // "0") | tonumber?) // 0) > 0) or ((((.blocks // "0") | tonumber?) // 0) > 0))
              ]
            }
      - id: uncoveredCoverageFiles
        kind: jq
        spec:
          from: $coverage
          expr: |
            [
              .components[]?
              | select((((.newUncoveredLines // "0") | tonumber?) // 0) > 0 or (((.newUncoveredConditions // "0") | tonumber?) // 0) > 0)
            ]
      - id: uncoveredCoverage
        kind: foreach
        spec:
          in: $uncoveredCoverageFiles
          as: file
          onMissing: skip
          concurrency: 4
          preserveOrder: true
          pipeline:
            - id: sourceLines
              kind: http
              spec:
                upstream: default
                method: GET
                path: /api/sources/lines
                parse: json
                query:
                  key: $file.key
                  pullRequest: $input.pullRequest
                  from: 1
                  to: $opts.sourceLineLimit
            - id: emitUncoveredFile
              kind: emit
              spec:
                from: $file
                vars:
                  file: $file
                  sourceLines: $sourceLines
                expr: |
                  (($sourceLines.sources // $sourceLines.lines // $sourceLines.source // []) as $lines
                  | {
                    key: $file.key,
                    path: $file.path,
                    newUncoveredLines: $file.newUncoveredLines,
                    newUncoveredConditions: $file.newUncoveredConditions,
                    uncoveredLines: [
                      $lines[]?
                      | select((.isNew // .new // false) == true)
                      | select((((.lineHits // .hits // -1) | tonumber?) // -1) == 0)
                      | {
                          line: (.line // .lineNumber),
                          code: (.code
                            | gsub("<[^>]*>"; "")
                            | gsub("&amp;"; "&")
                            | gsub("&gt;"; ">")
                            | gsub("&lt;"; "<")
                            | gsub("&quot;"; "\"")
                            | sub("^\\s+"; "")
                            | sub("\\s+$"; "")
                          )
                        }
                    ],
                    uncoveredConditions: [
                      $lines[]?
                      | select((.isNew // .new // false) == true)
                      | select(((((.conditions // 0) | tonumber?) // 0) > (((.coveredConditions // 0) | tonumber?) // 0)))
                      | {
                          line: (.line // .lineNumber),
                          code: (.code
                            | gsub("<[^>]*>"; "")
                            | gsub("&amp;"; "&")
                            | gsub("&gt;"; ">")
                            | gsub("&lt;"; "<")
                            | gsub("&quot;"; "\"")
                            | sub("^\\s+"; "")
                            | sub("\\s+$"; "")
                          ),
                          conditions: (.conditions // null),
                          coveredConditions: (.coveredConditions // null)
                        }
                    ]
                  })
      - id: enriched
        kind: foreach
        spec:
          in: $rawIssues.issues
          as: issue
          onMissing: skip
          concurrency: $opts.snippetConcurrency
          preserveOrder: true
          pipeline:
            - id: snippet
              kind: call
              spec:
                tool: GetSourcesIssueSnippets
                parse: json
                args:
                  issueKey: $issue.key
            - id: emitMinimal
              kind: emit
              spec:
                from: $issue
                vars:
                  issue: $issue
                  snippet: $snippet
                expr: |
                  {
                    key: $issue.key,
                    rule: $issue.rule,
                    severity: $issue.severity,
                    type: $issue.type,
                    message: $issue.message,
                    component: $issue.component,
                    path: (($issue.component // "") | split(":") | .[-1]),
                    startLine: ($issue.textRange.startLine // $issue.line),
                    endLine: ($issue.textRange.endLine // $issue.line),
                    debt: $issue.debt,
                    codeSnippet: [
                      ($snippet // {} | to_entries[] | .value | objects | .sources[]?)
                      | {
                          lineNumber: .line,
                          code: (.code
                            | gsub("<[^>]*>"; "")
                            | gsub("&amp;"; "&")
                            | gsub("&gt;"; ">")
                            | gsub("&lt;"; "<")
                            | gsub("&quot;"; "\"")
                            | sub("^\\s+"; "")
                            | sub("\\s+$"; "")
                          )
                        }
                    ]
                  }
      - id: done
        kind: return
        spec:
          from: $enriched
          vars:
            project: $input.projectKey
            branch: $input.branch
            pullRequest: $input.pullRequest
            rawIssues: $rawIssues
            uncoveredCoverage: $uncoveredCoverage
            duplicateMetrics: $duplicateMetrics
          expr: |
            ($uncoveredCoverage // []) as $coverageFiles
            | . as $issueItems
            | [
                $coverageFiles[]?
                | select(((((.newUncoveredLines // "0") | tonumber?) // 0) > 0))
                | {
                    key: .key,
                    path: .path,
                    value: .newUncoveredLines,
                    lines: (.uncoveredLines // [])
                  }
              ] as $uncoveredLineFiles
            | [
                $coverageFiles[]?
                | select(((((.newUncoveredConditions // "0") | tonumber?) // 0) > 0))
                | {
                    key: .key,
                    path: .path,
                    value: .newUncoveredConditions,
                    lines: (.uncoveredConditions // [])
                  }
              ] as $uncoveredConditionFiles
            | [
                ($duplicateMetrics.files // [])[]?
                | select(((((.density // "0") | tonumber?) // 0) > 0))
                | {key, path, value: .density, lines: .lines, blocks: .blocks}
              ] as $duplicateDensityFiles
            | [
                ($duplicateMetrics.files // [])[]?
                | select(((((.lines // "0") | tonumber?) // 0) > 0))
                | {key, path, value: .lines, density: .density, blocks: .blocks}
              ] as $duplicateLineFiles
            | {
              project: $project,
              branch: $branch,
              pullRequest: $pullRequest,
              summary: {
                sonarIssues: {
                  total: ($rawIssues.total // ($issueItems | length)),
                  returned: ($issueItems | length)
                },
                uncoveredLineFiles: ($uncoveredLineFiles | length),
                uncoveredLines: ([$uncoveredLineFiles[]? | .lines[]?] | length),
                uncoveredConditionFiles: ($uncoveredConditionFiles | length),
                uncoveredConditions: ([$uncoveredConditionFiles[]? | .lines[]?] | length),
                duplicateDensityFiles: ($duplicateDensityFiles | length),
                duplicateLineFiles: ($duplicateLineFiles | length),
                totalActionItems: (($issueItems | length) + ($uncoveredLineFiles | length) + ($uncoveredConditionFiles | length) + ($duplicateDensityFiles | length) + ($duplicateLineFiles | length))
              },
              buckets: {
                sonarIssues: $issueItems,
                uncoveredLines: $uncoveredLineFiles,
                uncoveredConditions: $uncoveredConditionFiles,
                duplicateDensity: $duplicateDensityFiles,
                duplicateLines: $duplicateLineFiles
              }
            }

  # ---- get_overall_issues ---------------------------------------------------
  - name: get_overall_issues
    enabled: true
    description: |
      Get all open issues for a project on a branch, optionally filtered
      by source file path. Returns minimal fields + code snippet lines
      to conserve AI agent tokens.
    input_schema:
      type: object
      required: [projectKey, branch]
      properties:
        projectKey:
          type: string
          description: SonarQube project key (e.g., rengine).
        branch:
          type: string
          description: Git branch name (e.g., main).
        component:
          type: string
          default: ""
          description: Optional file path filter. Full SonarQube component key (e.g., "rengine:src/main/java/Foo.java") or relative path under project.
        limit:
          type: integer
          default: 50
          minimum: 1
          maximum: 500
        newCodeOnly:
          type: boolean
          default: false
        snippetConcurrency:
          type: integer
          default: 6
          minimum: 1
          maximum: 16
    pipeline:
      - id: opts
        kind: jq
        spec:
          from: $input
          expr: |
            {
              scope: (if (.component // "") != "" then .component else .projectKey end),
              limit: (.limit // 50),
              newCodeOnly: (.newCodeOnly // false),
              snippetConcurrency: (.snippetConcurrency // 6)
            }
      - id: rawIssues
        kind: call
        spec:
          tool: GetIssuesSearch
          parse: json
          args:
            components: $opts.scope
            branch: $input.branch
            types: "CODE_SMELL,BUG,VULNERABILITY"
            resolved: "false"
            inNewCodePeriod: $opts.newCodeOnly
            ps: $opts.limit
        require:
          field: "issues"
          nonEmpty: true
          message: No issues found for the given project and branch.
      - id: enriched
        kind: foreach
        spec:
          in: $rawIssues.issues
          as: issue
          onMissing: skip
          concurrency: $opts.snippetConcurrency
          preserveOrder: true
          pipeline:
            - id: snippet
              kind: call
              spec:
                tool: GetSourcesIssueSnippets
                parse: json
                args:
                  issueKey: $issue.key
            - id: emitMinimal
              kind: emit
              spec:
                from: $issue
                vars:
                  issue: $issue
                  snippet: $snippet
                expr: |
                  {
                    key: $issue.key,
                    rule: $issue.rule,
                    severity: $issue.severity,
                    type: $issue.type,
                    message: $issue.message,
                    component: $issue.component,
                    path: (($issue.component // "") | split(":") | .[-1]),
                    startLine: ($issue.textRange.startLine // $issue.line),
                    endLine: ($issue.textRange.endLine // $issue.line),
                    debt: $issue.debt,
                    codeSnippet: [
                      ($snippet // {} | to_entries[] | .value | objects | .sources[]?)
                      | {
                          lineNumber: .line,
                          code: (.code
                            | gsub("<[^>]*>"; "")
                            | gsub("&amp;"; "&")
                            | gsub("&gt;"; ">")
                            | gsub("&lt;"; "<")
                            | gsub("&quot;"; "\"")
                            | sub("^\\s+"; "")
                            | sub("\\s+$"; "")
                          )
                        }
                    ]
                  }
      - id: done
        kind: return
        spec:
          from: $enriched
          vars:
            project: $input.projectKey
            branch: $input.branch
            total: $rawIssues.total
          expr: |
            . as $issueItems
            | {
              project: $project,
              branch: $branch,
              summary: {
                sonarIssues: {
                  total: $total,
                  returned: ($issueItems | length)
                },
                totalActionItems: ($issueItems | length)
              },
              buckets: {
                sonarIssues: $issueItems
              },
              issues: $issueItems
            }
