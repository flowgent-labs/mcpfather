      readOnlyHint: false
      destructiveHint: true
      idempotentHint: true
      openWorldHint: true
    input_schema:
      type: object
      required: [applicationPublicId, scanId]
      properties:
        applicationPublicId:
          type: string
          description: Sonatype IQ application public id.
        scanId:
          type: string
          description: Report id / scan id containing the violations.
        targets:
          type: array
          default: []
          description: >-
            Optional exact Security policy violation targets from get_scan_all_issues_recommends.
