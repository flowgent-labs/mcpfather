# Environment variables with MCP__ prefix override these values.
# e.g. MCP__SERVER__AUTH__OIDC__CLIENT_ID overrides server.auth.oidc.client_id

# ---- Frontend / Backend ----
# frontend = inbound: validates bearer tokens presented by MCP clients (AI agents).
# backend  = outbound: upstream API endpoints the server calls, keyed by name.
# The two are decoupled — the inbound token is never reused outbound.

# ---- Frontend (inbound auth) ----
server:
  # Override the default service name (derived from the binary name).
  # Affects filesystem paths and OpenTelemetry service.name.

  # Maximum number of concurrent AI agent client MCP requests.
  # HTTP server timeouts in seconds. 0 = disabled.
  # write_timeout_seconds must be 0 for SSE (Streamable HTTP) transport.
  read_timeout_seconds: 30
  write_timeout_seconds: 0
  idle_timeout_seconds: 120
  auth:
    # Standard OAuth 2.1 / OIDC JWT bearer validation (Resource Server role, RFC 9728).
    # Only enforced on the http transport; stdio has no network boundary.
    oidc:
      enabled: false
      issuer: ""            # e.g. https://idp.example.com/realms/myrealm
      jwks_uri: ""          # optional override (auto-discovered from issuer if empty)
      audience: ""          # expected JWT "aud" claim; also published as the RFC 9728 protected-resource identifier
      # When true, validated frontend JWT claims (sub, email) are forwarded upstream
      # as X-MCP-Client-Token-Sub and X-MCP-Client-Token-Email headers.
      enable_client_token_claim_forward: true
      # Additional JWT claims to forward as X-MCP-Client-Token-<Header-Name> headers.
      # e.g. ["given_name", "family_name", "preferred_username"]
      # additional_client_token_claim_forward: []
  # ---- Temporary File System (TFS) Data Plane ----
  # Built-in REST API for binary file transfer, separate from the
  # JSON-RPC 2.0 control plane at /mcp.
  # Upload:   POST /_/tfs/upload/{uuid}
  # Download: GET  /_/tfs/download/{uuid}
  # Files stored under ~/.<app>/tfs/{download,upload}/
  # with UUID-based filenames to prevent collisions.
  tfs:
    enabled: true
    # Public base URI used to build returned TFS download URLs.
    # Empty means auto-detect from the inbound /mcp request Host/X-Forwarded-* headers.
    base_uri: ""
    # Completed temporary files older than this are removed by the background clean job.
    clean-job-ttl-seconds: "5m"

# ---- Logging ----
logging:
  # Controls server-side request/response logging verbosity.
  # Priority for level: -v CLI flag > MCP__LOGGING__LEVEL ENV > logging.level in config.yaml
  level: 0                      # 0-10 (0=silent, 1-3=access, 4-7=+headers, 8-9=+values, 10=+body)
  auth_verbose: false           # set true to print Authorization/Cookie header values in logs

# ---- Management Endpoints (metrics, tracing, pprof) ----
mgmt:
  enabled: true
  host: 0.0.0.0
  port: 9991
  pprof:
    enabled: false
    server_bind: 0.0.0.0:6669
  otel:
    enabled: false
    endpoint: localhost:4317
    protocol: grpc             # grpc | http/protobuf | http/json
    timeout: 10000             # connection timeout in milliseconds
    sample_rate: 1.0           # 0.0–1.0 trace sampling ratio
  metrics:
    enabled: true
    prometheus: true
    export_interval: 30s
    histogram_boundaries:
      task: [0.005, 0.01, 0.025, 0.05, 0.1, 0.25, 0.5, 1, 2.5, 5, 10, 30, 60, 120]
    labels: {}                 # static labels added to every metric

# ---- Backend (outbound upstream) ----
upstream:
  default:
    endpoint: ""               # primary upstream API base URL (e.g. https://api.example.com)
    # When true, the MCP session ID is forwarded as X-MCP-Session-ID header.
    enable_mcp_session_forward: true
    auth:
      # OIDC client credentials flow (machine-to-machine)
      oidc:
        enabled: false
        issuer: ""            # e.g. https://keycloak.example.com/realms/myrealm
        client_id: ""
        client_secret: ""
        scopes: "openid"       # space-separated scope list
        token_url: ""          # optional override (auto-discovered from issuer if empty)

      # Static credentials for legacy / simple APIs
      static:
        web_token: ""       # static Bearer token
        web_token_file: ""   # path to file containing bearer token (K8s secrets)
        cookie_token: ""        # static cookie (e.g. JSESSIONID for legacy systems)
        cookie_token_file: ""   # path to file containing cookie token (K8s secrets)

  # Additional named backends referenced by http pipeline steps.
  # sonatypeiq:
  #   endpoint: https://iq.example.com
  #   enable_mcp_session_forward: true
  #   auth:
  #     static:
  #       web_token: ""       # static Bearer token for this upstream
  #       cookie_token: ""    # static cookie token for this upstream

# ---- Native MCP Tools ----
native_tools:
  expose:
    # When true, all native tools are registered by default
    # (individual tools can be hidden via excludes).
    # When false (the default), only tools listed in includes
    # are exposed.
    register_all_tools_by_default: false

    # Explicitly expose these tools (operationId values).
    # Takes precedence: tools listed here are always exposed,
    # even if register_all_tools_by_default is false.
    includes: []

    # Explicitly hide these tools from external agents (operationId values).
    # Takes precedence over register_all_tools_by_default.
    # A tool listed in BOTH includes and excludes will cause
    # the server to fail at startup.
    excludes: []

# ---- Reusable HTTP Middleware Policies ----
middleware:
  http_client_pool:
    large:
      max_idle_conns: 128          # reusable idle connections across all upstream hosts
      max_idle_conns_per_host: 32  # reusable idle connections retained per upstream host
      max_conns_per_host: 64       # hard cap: active + dialing + idle connections per host
      dial_timeout: 10s            # TCP connection establishment timeout
      request_timeout: 60s         # complete attempt, including response-body reads

# ---- Virtual Tools ----
# Compose multiple native tools into a single virtual tool via a declarative
# e.g: 5-step pipeline (call → jq → foreach → emit → return).
# Schema: https://github.com/flowgent-labs/mcpfather/blob/main/.agents/skills/virtual-tool-creator/resources/dsl-schema.json
virtual_tools:
  - name: get_scan_all_issues_recommends
    description: >
      Retrieve policy violations and Open security vulnerabilities for a scan,
      then enrich affected components with remediation suggestions.
    annotations:
      readOnlyHint: true
      destructiveHint: false
      idempotentHint: true
      openWorldHint: true
    input_schema:
      type: object
      required:
        - applicationPublicId
        - scanId
      properties:
        applicationPublicId:
          type: string
          default: your_project
          description: Sonatype IQ application public id.
        scanId:
          type: string
          default: b3a29500a885473ca6b4b5c759c39bf2
          description: Report id / scan id to inspect.
        minThreatLevel:
          type: integer
          default: 5
          minimum: 5
          maximum: 10
          description: Minimum policy threat level used to keep violations and components.
        includeWaived:
          type: boolean
          default: false
          description: Include waived policy violations and non-Open Security vulnerabilities. When false, return only current Open issues.
    pipeline:
      - id: policyPath
        kind: jq
        spec:
          vars:
            applicationPublicId: $input.applicationPublicId
            scanId: $input.scanId
          expr: '"/api/v2/applications/\($applicationPublicId)/reports/\($scanId)/policy"'
      - id: policy
        kind: http
        spec:
          upstream: default
          method: GET
          path: $policyPath
          pool: large
          parse: json
          query:
            includeViolationTimes: true
      - id: appInternal
        kind: jq
        spec:
          from: $policy.body
          expr: .application.id
        require:
          nonEmpty: true
          message: Cannot find internal application id in policy response.
      - id: history
        kind: jq
        spec:
          vars:
            appInternal: $appInternal
          expr: '"/api/v2/reports/applications/\($appInternal)/history"'
      - id: reportHistory
        kind: http
        spec:
          upstream: default
          method: GET
          path: $history
          pool: large
          parse: json
          query:
            limit: 100
      - id: stage
        kind: jq
        spec:
          from: $reportHistory.body
          vars:
            scanId: $input.scanId
          expr: |
            ([.reports[]
              | select(.scanId == $scanId)
              | .stage][0] // null)
        require:
          nonEmpty: true
          message: Cannot find stage for scanId=$input.scanId.
      - id: securityPagePath
        kind: jq
        spec:
          vars:
            applicationPublicId: $input.applicationPublicId
          expr: '"/rest/ci/componentDetails/application/\($applicationPublicId)/vulnerabilities"'
      - id: scanComponents
        kind: jq
        spec:
          from: $policy.body
          vars:
            minThreatLevel: $input.minThreatLevel
          expr: |
            [
              .components[]?
              | [
                  .violations[]?
                  | select(.policyThreatLevel >= $minThreatLevel)
                ] as $violations
              | {
                  displayName,
                  packageUrl,
                  hash,
                  sha256,
                  componentIdentifier,
                  maxThreatLevel:
                    ($violations | map(.policyThreatLevel) | max // 0),
                  violations:
                  [
                    $violations[]
                    | {
                        type: "policyViolation",
                        id: .policyViolationId,
                        policy: .policyName,
                        level: .policyThreatLevel,
                        category: .policyThreatCategory,
                        conditions:
                          [.constraints[]?.conditions[]?.conditionReason]
                      }
                  ],
                  componentIdentifierJSON:
                    (.componentIdentifier | tojson),
                  remediationRequest:
                  {
                    packageUrl,
                    hash,
                    sha256,
                    componentIdentifier,
                    displayName,
                    proprietary,
                    thirdParty,
                    originalPurl
                  }
                }
            ]
      - id: policyViolationRefs
        kind: jq
        spec:
          from: $scanComponents
          expr: |
            [
              .[] as $component
              | $component.violations[]?
              | {
                  hash: $component.hash,
                  id: .id
                }
            ]
            | unique_by(.hash + "|" + .id)
      - id: policyWaiverStates
        kind: foreach
        spec:
          in: $policyViolationRefs
          as: violation
          concurrency: 32
          preserveOrder: true
          pipeline:
            - id: applicableWaiverPath
              kind: jq
              spec:
                vars:
                  violationId: $violation.id
                expr: '"/api/v2/policyViolations/\($violationId)/applicableWaivers"'
            - id: applicableWaiver
              kind: http
              spec:
                upstream: default
                method: GET
                path: $applicableWaiverPath
                pool: large
                parse: json
            - id: policyWaiverState
              kind: emit
              spec:
                from: $violation
                vars:
                  applicableWaiver: $applicableWaiver.body
                expr: '. + {waived: ((($applicableWaiver.activeWaivers // []) | length) > 0)}'
      - id: policyWaiverMap
        kind: jq
        spec:
          from: $policyWaiverStates
          expr: |
            reduce .[] as $violation (
              {};
              .[($violation.hash + "|" + $violation.id)] =
                $violation.waived
            )
      - id: identifiableComponents
        kind: jq
        spec:
          from: $scanComponents
          expr: '[.[] | select(.componentIdentifier != null)]'
      - id: policyOnlyComponents
        kind: jq
        spec:
          from: $scanComponents
          vars:
            policyWaiverMap: $policyWaiverMap
            includeWaived: $input.includeWaived
          expr: |
            [
              .[] as $component
              | [
                  $component.violations[]? as $violation
                  | $violation
                    + {
                        waived:
                          (
                            $policyWaiverMap[
                              ($component.hash + "|" + $violation.id)
                            ] // false
                          )
                      }
                  | select($includeWaived or (.waived != true))
                ] as $visiblePolicyViolations
              | select(
                  $component.componentIdentifier == null
                  and ($visiblePolicyViolations | length) > 0
                )
              | $component + {
                  violations: $visiblePolicyViolations,
                  active: any($visiblePolicyViolations[]?; .waived != true),
                  securityVulnerabilities: []
                }
            ]
      - id: discoveredComponents
        kind: foreach
        spec:
          in: $identifiableComponents
          as: component
          concurrency: 32
          preserveOrder: true
          pipeline:
            - id: securityPage
              kind: http
              spec:
                upstream: default
                method: GET
                path: $securityPagePath
                pool: large
                query:
                  hash: $component.hash
                  scanId: $input.scanId
                  componentIdentifier: $component.componentIdentifierJSON
                parse: json
            - id: discoveredComponent
              kind: emit
              spec:
                from: $component
                vars:
                  securityPage: $securityPage
                  policyWaiverMap: $policyWaiverMap
                  includeWaived: $input.includeWaived
                expr: |
                  . as $component
                  | [
                      $component.violations[]? as $violation
                      | $violation
                        + {
                            waived:
                              (
                                $policyWaiverMap[
                                  ($component.hash + "|" + $violation.id)
                                ] // false
                              )
                          }
                      | select($includeWaived or (.waived != true))
                    ]
                    | unique_by(.id)
                    as $visiblePolicyViolations
                  | [
                      $securityPage.body.securityVulnerabilities[]?
                      | select(
                          $includeWaived
                          or ((.status // "" | ascii_downcase) == "open")
                        )
                      | {
                          type: "securityVulnerability",
                          id: .refId,
                          source: (.source // "cve"),
                          status: (.status // "Unknown"),
                          severity,
                          cwe,
                          summary
                        }
                    ]
                    | unique_by(.id)
                    as $visibleVulnerabilities
                  | $component + {
                      violations: $visiblePolicyViolations,
                      active:
                        (
                          any($visiblePolicyViolations[]?; .waived != true)
                          or any(
                            $visibleVulnerabilities[]?;
                            (.status // "" | ascii_downcase) == "open"
                          )
                        ),
                      securityVulnerabilities: $visibleVulnerabilities
                    }
      - id: reportComponents
        kind: jq
        spec:
          from: $discoveredComponents
          vars:
            policyOnlyComponents: $policyOnlyComponents
          expr: |
            [
              .[]
              | select(
                  (.violations | length) > 0
                  or (.securityVulnerabilities | length) > 0
                )
            ]
            + $policyOnlyComponents
      - id: remediableReportComponents
        kind: jq
        spec:
          from: $reportComponents
          expr: '[.[] | select(.componentIdentifier != null or ((.packageUrl // "") | length) > 0)]'
      - id: nonRemediableReportComponents
        kind: jq
        spec:
          from: $reportComponents
          expr: '[.[] | select(.componentIdentifier == null and ((.packageUrl // "") | length) == 0)]'
      - id: remediatedComponents
        kind: foreach
        spec:
          in: $remediableReportComponents
          as: component
          concurrency: 32
          preserveOrder: true
          pipeline:
            - id: remediationPath
              kind: jq
              spec:
                vars:
                  appInternal: $appInternal
                expr: '"/api/v2/components/remediation/application/\($appInternal)"'
            - id: remediation
              kind: http
              spec:
                upstream: default
                method: POST
                path: $remediationPath
                pool: large
                parse: json
                query:
                  stageId: $stage
                  scanId: $input.scanId
                  includeParentRemediation: true
                body: $component.remediationRequest
            - id: enrichedComponent
              kind: emit
              spec:
                from: $component
                vars:
                  remediation: $remediation.body
                  currentPackageUrl: $component.packageUrl
                expr: |
                  . as $component
                  | ([
                      $remediation.remediation.versionChanges[]?
                      | select((.data.component.packageUrl // "") != $currentPackageUrl)
                      | {
                          version: .data.component.componentIdentifier.coordinates.version,
                          type
                        }
                    ] | unique_by(.version + "|" + .type)) as $upgrades
                  | {
                      component: {
                        hash: $component.hash,
                        name: $component.displayName,
                        purl: $component.packageUrl,
                        format: $component.componentIdentifier.format,
                        coordinates: $component.componentIdentifier.coordinates
                      },
                      active: $component.active,
                      maxThreatLevel: $component.maxThreatLevel,
                      policyViolations: $component.violations,
                      securityVulnerabilities: $component.securityVulnerabilities,
                      upgrade: {
                        available: (($upgrades | length) > 0),
                        recommendations: $upgrades
                      }
                    }
      - id: nonRemediatedComponents
        kind: jq
        spec:
          from: $nonRemediableReportComponents
          expr: |
            [
              .[] as $component
              | {
                  component: {
                    hash: $component.hash,
                    name: $component.displayName,
                    purl: $component.packageUrl,
                    format: null,
                    coordinates: null
                  },
                  active: $component.active,
                  maxThreatLevel: $component.maxThreatLevel,
                  policyViolations: $component.violations,
                  securityVulnerabilities: $component.securityVulnerabilities,
                  upgrade: {
                    available: false,
                    recommendations: []
                  }
                }
            ]
      - id: components
        kind: jq
        spec:
          from: $remediatedComponents
          vars:
            nonRemediatedComponents: $nonRemediatedComponents
          expr: '. + $nonRemediatedComponents'
      - id: report
        kind: return
        spec:
          from: $components
          vars:
            appPublic: $input.applicationPublicId
            appInternal: $appInternal
            scanId: $input.scanId
            stage: $stage
            includeWaived: $input.includeWaived
          expr: |
            [
              .[]
              | {
                  hash: .component.hash,
                  name: .component.name,
                  purl: .component.purl,
                  active,
                  upgrade: .upgrade,
                  issues:
                    (
                      [
                        .policyViolations[]?
                        | {
                            type,
                            id,
                            status: (if .waived then "waived" else "open" end),
                            severity: .level,
                            category,
                            policy,
                            reasons: .conditions
                          }
                      ]
                      +
                      [
                        .securityVulnerabilities[]?
                        | {
                            type,
                            id,
                            status: (.status | ascii_downcase),
                            severity,
                            source,
                            cwe
                          }
                      ]
                      | unique_by(.type + "|" + .id)
                    )
                }
            ] as $compactComponents
            | [
                $compactComponents[] as $component
                | $component.issues[]?
                | . + {componentHash: $component.hash}
              ]
              | unique_by(.componentHash + "|" + .type + "|" + .id)
            as $allIssues
            | {
                applicationId: $appPublic,
                scanId: $scanId,
                stage: $stage,
                includeWaived: $includeWaived,
                summary: {
                  componentCount: ($compactComponents | length),
                  issueCount: ($allIssues | length),
                  openIssueCount:
                    ([
                      $allIssues[]
                      | select(.status == "open")
                    ] | length),
                  policyViolationCount:
                    ([
                      $allIssues[]
                      | select(.type == "policyViolation")
                    ] | length),
                  securityViolationCount:
                    ([
                      $allIssues[]
                      | select(
                          .type == "policyViolation"
                          and .category == "SECURITY"
                        )
                    ] | length),
                  securityVulnerabilityCount:
                    ([
                      $allIssues[]
                      | select(.type == "securityVulnerability")
                    ] | length)
                },
                components: $compactComponents
              }

  - name: trigger_reevaluate_report
    description: Re-evaluate the latest report for its stage after policy or waiver changes.
    annotations:
      readOnlyHint: false
      destructiveHint: true
      idempotentHint: false
      openWorldHint: true
    input_schema:
      type: object
      required: [applicationPublicId, scanId]
      properties:
        applicationPublicId:
          type: string
          description: Sonatype IQ application public id.
        scanId:
          type: string
          description: Latest report id / scan id for its stage.
        quick:
          type: boolean
          default: false
          description: Skip auto-waiver updates for a faster reevaluation.
    pipeline:
      - id: applications
        kind: http
        spec:
          upstream: default
          method: GET
          path: /api/v2/applications
          query:
            publicId: $input.applicationPublicId
            includeCategories: false
          parse: json
      - id: appInternal
        kind: jq
        spec:
          from: $applications.body
          vars:
            applicationPublicId: $input.applicationPublicId
          expr: '[.applications[]? | select(.publicId == $applicationPublicId) | .id][0]'
        require:
          nonEmpty: true
          message: Cannot find applicationPublicId=$input.applicationPublicId.
      - id: latestReports
        kind: call
        spec:
          tool: GetByApplicationId
          parse: json
          args:
            applicationId: $appInternal
      - id: stage
        kind: jq
        spec:
          from: $latestReports
          vars:
            scanId: $input.scanId
          expr: '[.[]? | select(any([.reportHtmlUrl, .reportDataUrl, .reportPdfUrl, .embeddableReportHtmlUrl][]? | strings; contains("/" + $scanId + "/") or endswith("/" + $scanId))) | .stage][0]'
        require:
          nonEmpty: true
          message: Re-evaluation is allowed only for the latest scan of a stage; scanId=$input.scanId is not latest.
      - id: options
        kind: jq
        spec:
          from: $input
          expr: '{quick: (.quick // false)}'
      - id: csrfBootstrap
        kind: http
        spec:
          upstream: default
          method: GET
          path: /assets/index.html
      - id: csrfToken
        kind: jq
        spec:
          from: $csrfBootstrap.headers
          expr: '((."Set-Cookie" // ."set-cookie" // []) | if type == "array" then . else [.] end | map(select(startswith("CLM-CSRF-TOKEN="))) | .[0] // "" | capture("^CLM-CSRF-TOKEN=(?<token>[^;]+)").token)'
        require:
          nonEmpty: true
          message: Cannot obtain CLM-CSRF-TOKEN from IQ UI bootstrap response.
      - id: csrfCookie
        kind: jq
        spec:
          vars:
            csrfToken: $csrfToken
          expr: '"CLM-CSRF-TOKEN=" + $csrfToken'
      - id: reevaluatePath
        kind: jq
        spec:
          vars:
            applicationPublicId: $input.applicationPublicId
            scanId: $input.scanId
            quick: $options.quick
          expr: '"/rest/report/\($applicationPublicId)/\($scanId)/reevaluatePolicy" + (if $quick then "?skipAutoWaivers=true" else "" end)'
      - id: trigger
        kind: http
        spec:
          upstream: default
          method: POST
          path: $reevaluatePath
          headers:
            Cookie: $csrfCookie
            X-CSRF-TOKEN: $csrfToken
          body: {}
      - id: result
        kind: return
        spec:
          vars:
            applicationPublicId: $input.applicationPublicId
            scanId: $input.scanId
            stage: $stage
            quick: $options.quick
          expr: '{applicationId: $applicationPublicId, scanId: $scanId, stage: $stage, mode: (if $quick then "quick" else "full" end), status: "triggered"}'

  - name: add_waiver_policy_violations
    description: Create temporary policy waivers. Waivers do not rewrite scan-time condition reasons such as vulnerability status 'Open'.
    annotations:
      readOnlyHint: false
      destructiveHint: true
      idempotentHint: true
      openWorldHint: true
    input_schema:
      type: object
      required: [applicationPublicId, scanId]
      properties:
        applicationPublicId:
          type: string
          description: Sonatype IQ application public id.
        scanId:
          type: string
          description: Report id / scan id used to identify the stage; the latest report for that stage is processed.
        targets:
          type: array
          default: []
          description: >-
            Optional exact policy violation targets from get_scan_all_issues_recommends.
            Example: [{"hash":"d4f3c448998c6cf8267f","id":"df5044470b6a4027b949e90132a1f2ad"}].
            In Bash or PowerShell: --targets '[{"hash":"d4f3c448998c6cf8267f","id":"df5044470b6a4027b949e90132a1f2ad"}]'.
            Empty or omitted processes all eligible issues when allByDefault=true.
          items:
            type: object
            required: [hash, id]
            properties:
              hash:
                type: string
                description: Component hash from query output components[].hash.
              id:
                type: string
                description: Policy violation id from query output components[].issues[].id.
        allByDefault:
          type: boolean
          default: true
          description: When targets is empty or omitted, process all eligible issues. Set false to require explicit targets.
        waiverDays:
          type: integer
          default: 14
          minimum: 1
          maximum: 365
          description: Number of days before the waivers expire.
        comment:
          type: string
          default: Temporary waiver for emergency release remediation.
          minLength: 1
          description: Audit comment recorded on every waiver.
        force:
          type: boolean
          default: false
          description: If set to true, all components are included, this means that components or dependencies with upgrade recommendations will also be execute to add the waiver or acknowledge.
    pipeline:
      - id: applications
        kind: http
        spec:
          upstream: default
          method: GET
          path: /api/v2/applications
          query:
            publicId: $input.applicationPublicId
            includeCategories: false
          parse: json
      - id: appInternal
        kind: jq
        spec:
          from: $applications.body
          vars:
            applicationPublicId: $input.applicationPublicId
          expr: '[.applications[]? | select(.publicId == $applicationPublicId) | .id][0]'
        require:
          nonEmpty: true
          message: Cannot find applicationPublicId=$input.applicationPublicId.
      - id: history
        kind: call
        spec:
          tool: GetReportHistoryForApplication
          parse: json
          args:
            applicationId: $appInternal
            limit: 100
      - id: latestReports
        kind: call
        spec:
          tool: GetByApplicationId
          parse: json
          args:
            applicationId: $appInternal
      - id: stage
        kind: jq
        spec:
          from: $history
          vars:
            scanId: $input.scanId
            latestReports: $latestReports
          expr: |
            ([.reports[]? | select(.scanId == $scanId) | .stage][0])
            // ([$latestReports[]?.stage] | unique | if length == 1 then .[0] else null end)
        require:
          nonEmpty: true
          message: Cannot resolve stage for scanId=$input.scanId; the scan is absent from history and multiple latest stages exist.
      - id: effectiveScanId
        kind: jq
        spec:
          from: $latestReports
          vars:
            stage: $stage
          expr: |
            [
              .[]?
              | select(.stage == $stage)
              | [.reportHtmlUrl, .reportDataUrl, .reportPdfUrl, .embeddableReportHtmlUrl][]?
              | strings
              | capture("/reports?/(?<scanId>[^/]+)(/|$)")?
              | .scanId
            ][0]
        require:
          nonEmpty: true
          message: Cannot find latest report for stage resolved from scanId=$input.scanId.
      - id: policy
        kind: call
        spec:
          tool: GetPolicyViolations1
          parse: json
          args:
            applicationPublicId: $input.applicationPublicId
            scanId: $effectiveScanId
            includeViolationTimes: true
      - id: options
        kind: jq
        spec:
          from: $input
          expr: |
            {
              waiverDays: (.waiverDays // 14),
              comment: (.comment // "Temporary waiver for emergency release remediation."),
              concurrency: 4,
              force: (.force // false),
              allByDefault: (if .allByDefault == null then true else .allByDefault end),
              expiryTime: (now + ((.waiverDays // 14) * 86400) | todateiso8601)
            }
      - id: selectedViolations
        kind: jq
        spec:
          from: $policy
          vars:
            targets: $input.targets
            allByDefault: $options.allByDefault
          expr: |
            [
              .components[]? as $component
              | $component.violations[]? as $violation
              | select(
                  (($targets | length) == 0 and $allByDefault)
                  or any(
                    $targets[]?;
                    .hash == $component.hash
                    and .id == $violation.policyViolationId
                  )
                )
              | {id: $violation.policyViolationId, hash: $component.hash}
            ] | unique_by(.id)
      - id: waiverStates
        kind: foreach
        spec:
          in: $selectedViolations
          as: violation
          concurrency: 4
          preserveOrder: true
          pipeline:
            - id: applicableWaiverPath
              kind: jq
              spec:
                vars:
                  violationId: $violation.id
                expr: '"/api/v2/policyViolations/\($violationId)/applicableWaivers"'
            - id: applicableWaiver
              kind: http
              spec:
                upstream: default
                method: GET
                path: $applicableWaiverPath
                parse: json
            - id: waiverState
              kind: emit
              spec:
                from: $violation
                vars:
                  applicableWaiver: $applicableWaiver.body
                expr: '. + {hasActiveWaiver: (($applicableWaiver.activeWaivers // []) | length) > 0}'
      - id: activeWaivers
        kind: jq
        spec:
          from: $waiverStates
          expr: '[.[] | select(.hasActiveWaiver) | {policyViolationId: .id}]'
      - id: componentsToCheck
        kind: jq
        spec:
          from: $policy
          vars:
            targets: $input.targets
            allByDefault: $options.allByDefault
            activeWaivers: $activeWaivers
          expr: |
            [
              .components[]? as $component
              | select(
                  [
                    $component.violations[]? as $violation
                    | select(
                        (any($activeWaivers[]?; .policyViolationId == $violation.policyViolationId) | not)
                        and (
                          (($targets | length) == 0 and $allByDefault)
                          or any(
                            $targets[]?;
                            .hash == $component.hash
                            and .id == $violation.policyViolationId
                          )
                        )
                      )
                  ] | length > 0
                )
              | $component
              | {
                  displayName,
                  packageUrl,
                  hash,
                  componentIdentifier,
                  violations,
                  remediationRequest: {
                    displayName,
                    packageUrl,
                    hash,
                    componentIdentifier
                  }
                }
            ]
      - id: componentsForRemediation
        kind: jq
        spec:
          from: $componentsToCheck
          vars:
            force: $options.force
          expr: |
            if $force
            then []
            else [
              .[]
              | select(
                  .componentIdentifier != null
                  or ((.packageUrl // "") | length) > 0
                )
            ]
            end
      - id: checkedComponents
        kind: foreach
        spec:
          in: $componentsForRemediation
          as: component
          concurrency: $options.concurrency
          preserveOrder: true
          pipeline:
            - id: remediation
              kind: call
              spec:
                tool: GetSuggestedRemediationForComponent
                parse: json
                args:
                  ownerType: application
                  ownerId: $appInternal
                  stageId: $stage
                  scanId: $effectiveScanId
                  includeParentRemediation: true
                  body: $component.remediationRequest
            - id: checkedComponent
              kind: emit
              spec:
                from: $component
                vars:
                  remediation: $remediation
                  currentPackageUrl: $component.packageUrl
                expr: |
                  (. | del(.remediationRequest))
                  + {
                      hasSuggestedVersion:
                        any(
                          $remediation.remediation.versionChanges[]?;
                          (.data.component.packageUrl // "") != $currentPackageUrl
                        )
                    }
      - id: eligibleComponents
        kind: jq
        spec:
          from: $checkedComponents
          vars:
            force: $options.force
            componentsToCheck: $componentsToCheck
          expr: |
            if $force
            then $componentsToCheck
            else [.[] | select(.hasSuggestedVersion != true)]
            end
      - id: skippedSuggestedRemediation
        kind: jq
        spec:
          from: $checkedComponents
          vars:
            force: $options.force
            targets: $input.targets
            allByDefault: $options.allByDefault
            activeWaivers: $activeWaivers
          expr: |
            if $force then [] else [
              .[]
              | select(.hasSuggestedVersion == true)
              | . as $component
              | $component.violations[]? as $violation
              | select(any($activeWaivers[]?; .policyViolationId == $violation.policyViolationId) | not)
              | select(
                  (($targets | length) == 0 and $allByDefault)
                  or any($targets[]?; .hash == $component.hash and .id == $violation.policyViolationId)
                )
              | {id: $violation.policyViolationId, hash: $component.hash}
            ] | unique_by(.id) end
      - id: candidates
        kind: jq
        spec:
          from: $eligibleComponents
          vars:
            targets: $input.targets
            allByDefault: $options.allByDefault
            activeWaivers: $activeWaivers
          expr: |
            [
              .[] as $component
              | $component.violations[]? as $violation
              | $violation
              | select(any($activeWaivers[]?; .policyViolationId == $violation.policyViolationId) | not)
              | select(
                  (($targets | length) == 0 and $allByDefault)
                  or any(
                    $targets[]?;
                    .hash == $component.hash
                    and .id == $violation.policyViolationId
                  )
                )
              | {
                  id: .policyViolationId,
                  hash: $component.hash
                }
            ] | unique_by(.id)
      - id: alreadyWaived
        kind: jq
        spec:
          from: $policy
          vars:
            targets: $input.targets
            allByDefault: $options.allByDefault
            activeWaivers: $activeWaivers
          expr: |
            [
              .components[]? as $component
              | $component.violations[]? as $violation
              | $violation
              | select(any($activeWaivers[]?; .policyViolationId == $violation.policyViolationId))
              | select(
                  (($targets | length) == 0 and $allByDefault)
                  or any(
                    $targets[]?;
                    .hash == $component.hash
                    and .id == $violation.policyViolationId
                  )
                )
            ] | length
      - id: batches
        kind: jq
        spec:
          from: $candidates
          expr: |
            [
              range(0; length; 1000) as $offset
              | .[$offset:($offset + 1000)]
              | {
                  violationIds: [.[].id],
                  violations: .
                }
            ]
      - id: waivers
        kind: foreach
        spec:
          in: $batches
          as: batch
          concurrency: $options.concurrency
          preserveOrder: true
          pipeline:
            - id: addWaiver
              kind: call
              spec:
                tool: AddBulkPolicyWaivers
                args:
                  ownerType: application
                  ownerId: $appInternal
                  body:
                    apiWaiverOptionsDTO:
                      comment: $options.comment
                      matcherStrategy: EXACT_COMPONENT
                      expiryTime: $options.expiryTime
                    violationIds: $batch.violationIds
            - id: waivedViolation
              kind: emit
              spec:
                from: $batch.violations
                vars:
                  expiryTime: $options.expiryTime
                expr: 'map(. + {status: "waived"})'
      - id: flattenedWaivers
        kind: jq
        spec:
          from: $waivers
          expr: flatten
      - id: verifiedWaivers
        kind: foreach
        spec:
          in: $flattenedWaivers
          as: issue
          concurrency: 4
          preserveOrder: true
          pipeline:
            - id: verifyWaiverPath
              kind: jq
              spec:
                vars:
                  violationId: $issue.id
                expr: '"/api/v2/policyViolations/\($violationId)/applicableWaivers"'
            - id: verifyWaiver
              kind: http
              spec:
                upstream: default
                method: GET
                path: $verifyWaiverPath
                parse: json
            - id: verifyWaiverAgain
              kind: http
              spec:
                upstream: default
                method: GET
                path: $verifyWaiverPath
                parse: json
            - id: verifiedWaiver
              kind: emit
              spec:
                from: $issue
                vars:
                  verifyWaiver: $verifyWaiverAgain.body
                expr: 'select((($verifyWaiver.activeWaivers // []) | length) > 0)'
      - id: result
        kind: return
        spec:
          from: $verifiedWaivers
          vars:
            applicationPublicId: $input.applicationPublicId
            requestedScanId: $input.scanId
            scanId: $effectiveScanId
            expiryTime: $options.expiryTime
            alreadyWaived: $alreadyWaived
            attempted: $flattenedWaivers
            skippedSuggestedRemediation: $skippedSuggestedRemediation
          expr: |
            {
              scope: "policy-violations",
              applicationPublicId: $applicationPublicId,
              requestedScanId: $requestedScanId,
              scanId: $scanId,
              usedLatestReport: ($requestedScanId != $scanId),
              expiresAt: $expiryTime,
              alreadyWaived: $alreadyWaived,
              attempted: ($attempted | length),
              skippedSuggestedRemediation: ($skippedSuggestedRemediation | length),
              skippedIssues: $skippedSuggestedRemediation,
              apiVerifiedWaived: length,
              apiUnverified: (($attempted | length) - length),
              reportReevaluationRequired: (($alreadyWaived > 0) or (($attempted | length) > 0)),
              nextAction: (if ($skippedSuggestedRemediation | length) > 0 then "Review suggested upgrades or rerun with --force true to waive skipped violations." else "Run trigger_reevaluate_report for the latest scan of this stage before checking UI status." end),
              count: length,
              issues: .
            }

