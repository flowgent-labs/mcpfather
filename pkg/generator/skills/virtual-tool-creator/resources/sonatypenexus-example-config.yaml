# Sonatype Nexus/IQ Virtual Tools
# =============================================================================
# Use case e.g: AI agent FOSS autonomy fixer. When a Java biz-project PR triggers a CI
# security scan that finds a vulnerable dependency, the AI agent calls these
# virtual tools to get safe upgrade candidates → then auto-updates pom.xml.
#
# Architecture:
#   Nexus Repository API  — ListSearch (native MCP tool, "call" step)
#   Sonatype IQ Firewall   — POST /api/v2/firewall/components/{rmId}/{repoId}/evaluate
#                            via "http" step (extra_upstream: sonatypeiq)
#   Nexus ≠ IQ: Nexus API has no firewall/quarantine fields. That data lives
#   only in IQ, so a cross-service pipeline is required.
#
# Two virtual tools — Basic (no filtering) + Enterprise (IQ firewall filtering):
#
#   maven_top5_versions (3 steps):
#     call(ListSearch) → jq(top5) → return
#
#   maven_top5_versions_safe (7 steps):
#     call(ListSearch) → jq(packageUrl + sha1 hash from Nexus AssetXO.checksum)
#     → jq(IQ request body: {format, components}) → jq(IQ URL path)
#     → http(POST IQ firewall evaluate) → jq(index by packageUrl, extract
#     quarantined + non-waived threatLevel) → return(merge + split into
#     safeVersions/blockedVersions, firewallStatus = allow|deny)
#
# IQ API key details (verified against sonatypeiq-v1.203.0 OAS):
#   - Request: {format, components: [{packageUrl, hash}]}
#     hash format "sha1:<hex>" is REQUIRED for Maven (hash-based format).
#     Components without hash are silently dropped from the request.
#   - Response: .results[].quarantined (bool) + .policyViolations[].threatLevel
#     Waived violations have non-null waiveTime (no explicit "waived" boolean).
#   - firewallStatus = "deny" when quarantined=true OR any active violation
#     has threatLevel >= minThreatLevel (default 1, i.e. any violation blocks).
#   - http step path does NOT support inline $ref → use a jq step to build
#     the full path string, then reference it ($iqPath) in the http spec.
#
# Required upstream config:
#   upstream.default.endpoint  → Nexus Repository base URL
#   upstream.sonatypeiq.endpoint → IQ Server base URL
#   upstream.sonatypeiq.auth.static.web_token → IQ user:pass (Base64) or API key
#
# Schema: dsl-schema.json
# -----------------------------------------------------------------------------

# nexus-mcp MCP server configuration — generated by mcpfather (https://github.com/flowgent-labs/mcpfather)
# Place this file at: $HOME/.nexus-mcp/config.yaml
# Environment variables with MCP__ prefix override these values.
# e.g. MCP__UPSTREAM__DEFAULT__AUTH__OIDC__CLIENT_ID overrides upstream.default.auth.oidc.client_id

# ---- Server (inbound auth) ----
server:
  auth:
    oidc:
      enabled: false
      issuer: ""
      jwks_uri: ""
      audience: ""
      enable_client_token_claim_forward: true
  max_parallel_requests: 100

# ---- Upstream (outbound) ----
upstream:
  default:
    endpoint: ""               # Nexus Repository API base URL (e.g. https://nexus.example.com)
    enable_mcp_session_forward: true
    auth:
      oidc:
        enabled: false
        issuer: ""
        client_id: ""
        client_secret: ""
        scopes: "openid"
        token_url: ""
      static:
        web_token: ""
        web_token_file: ""
        cookie_token: ""
        cookie_token_file: ""

  sonatypeiq:
    endpoint: ""               # IQ Server REST API base URL (e.g. https://iq.example.com)
    enable_mcp_session_forward: false
    auth:
      static:
        web_token: ""          # IQ REST API user token (Base64 user:pass or API key)
        web_token_file: ""
      oidc:
        enabled: false

# ---- Runtime settings ----
runtime:
  download_dir: ""
  log_authorization: false

# ---- Management Endpoints ----
mgmt:
  enabled: true
  host: 0.0.0.0
  port: 9991
  pprof:
    enabled: false
    server_bind: 0.0.0.0:6669
  otel:
    enabled: false
    endpoint: localhost:4317
    protocol: grpc
    timeout: 10000
    sample_rate: 1.0
  metrics:
    enabled: true
    prometheus: true
    export_interval: 30s
    histogram_boundaries:
      task: [0.005, 0.01, 0.025, 0.05, 0.1, 0.25, 0.5, 1, 2.5, 5, 10, 30, 60, 120]
    labels: {}

# ---- Native MCP Tools ----
nativeTools:
  expose:
    register_all_tools_by_default: false
    includes:
      - ListSearch
    excludes: []

# ---- Virtual Tools ----
virtualTools:
  # =========================================================================
  # Basic — top 5 versions, no firewall filtering
  # =========================================================================
  - name: maven_top5_versions
    enabled: true
    description: >
      Resolve the top 5 versions (latest first) for a Maven artifact given
      its groupId and artifactId. No quarantine filtering.

    annotations:
      readOnlyHint: true
      destructiveHint: false
      idempotentHint: true
      openWorldHint: true

    inputSchema:
      type: object
      required:
        - mavenGroupId
        - mavenArtifactId
      properties:
        mavenGroupId:
          type: string
          description: Maven group ID, e.g. "com.fasterxml.jackson.core".
        mavenArtifactId:
          type: string
          description: Maven artifact ID, e.g. "jackson-databind".

    pipeline:
      - id: search
        kind: call
        spec:
          tool: ListSearch
          parse: json
          args:
            maven.groupId: $input.mavenGroupId
            maven.artifactId: $input.mavenArtifactId
            format: maven2
            sort: version
            direction: desc

      - id: top5
        kind: jq
        spec:
          from: $search
          expr: |
            [.items[:5] | .[] | {
              group,
              name,
              version,
              repository,
              downloadUrl: (.assets[0].downloadUrl // null)
            }]

      - id: result
        kind: return
        spec:
          from: $top5
          vars:
            groupId: $input.mavenGroupId
            artifactId: $input.mavenArtifactId
          expr: |
            {
              coordinate: "\($groupId):\($artifactId)",
              totalFound: (. | length),
              versions: [.[] | .version],
              components: .
            }

  # =========================================================================
  # Enterprise — top N firewall-safe versions via IQ Firewall evaluate
  # =========================================================================
  - name: maven_top5_versions_safe
    enabled: true
    description: >
      Resolve the top N firewall-safe (non-quarantined, no active policy
      violations >= minThreatLevel) Maven artifact versions by evaluating
      candidates against Sonatype IQ Firewall.

    annotations:
      readOnlyHint: true
      destructiveHint: false
      idempotentHint: true
      openWorldHint: true

    inputSchema:
      type: object
      required:
        - mavenGroupId
        - mavenArtifactId
        - repository
        - repositoryManagerId
      properties:
        mavenGroupId:
          type: string
          description: Maven group ID, e.g. "com.fasterxml.jackson.core".
        mavenArtifactId:
          type: string
          description: Maven artifact ID, e.g. "jackson-databind".
        repository:
          type: string
          description: >
            Nexus Repository name (for ListSearch) AND IQ repository ID
            (path param). Usually the same name in both systems.
        repositoryManagerId:
          type: string
          description: >
            Sonatype IQ repository manager ID (path param), e.g. "nexus".
            Identifies the connected Nexus RM instance in IQ.
        limit:
          type: integer
          default: 5
          minimum: 1
          maximum: 50
          description: Max safe versions to return.
        fetchLimit:
          type: integer
          default: 20
          minimum: 1
          maximum: 50
          description: >
            Candidate count from Nexus for IQ evaluation. Fetch more than
            `limit` to absorb blocked versions. Increase if safeCount < limit.
        minThreatLevel:
          type: integer
          default: 1
          minimum: 0
          maximum: 10
          description: >
            Minimum threat level for a blocking verdict. Default 1 = any
            active policy violation blocks. Set 7+ for security-only.

    pipeline:
      # Step 1: Fetch candidates from Nexus
      - id: search
        kind: call
        spec:
          tool: ListSearch
          parse: json
          args:
            maven.groupId: $input.mavenGroupId
            maven.artifactId: $input.mavenArtifactId
            format: maven2
            sort: version
            direction: desc
            repository: $input.repository
        require:
          nonEmpty: true
          message: "No matching components found in repository."

      # Step 2: Build packageUrl + extract SHA1 hash from Nexus AssetXO.checksum
      # Maven is hash-based → IQ requires "sha1:<hex>" to identify file content.
      - id: candidates
        kind: jq
        spec:
          from: $search
          vars:
            fetchLimit: $input.fetchLimit
          expr: |
            [.items[:($fetchLimit // 20)] | .[] | {
              group,
              name,
              version,
              repository,
              downloadUrl: (.assets[0].downloadUrl // null),
              packageUrl:
                "pkg:maven/\(.group | gsub("\\."; "/"))/\(.name)@\(.version)",
              hash: (
                if (.assets[0].checksum.sha1 // "" | length > 0)
                then "sha1:\(.assets[0].checksum.sha1)"
                else null
                end
              )
            }]
        require:
          nonEmpty: true
          message: "No candidate versions extracted from search results."

      # Step 3: Build IQ evaluate request {format, components:[{packageUrl,hash}]}
      # Components without hash are dropped (can't be evaluated for Maven).
      - id: iqBody
        kind: jq
        spec:
          from: $candidates
          expr: |
            {
              format: "maven2",
              components: [.[] | { packageUrl, hash } | select(.hash != null)]
            }

      # Step 4: Build IQ URL path (http step path doesn't support inline $ref)
      - id: iqPath
        kind: jq
        spec:
          vars:
            repoMgrId: $input.repositoryManagerId
            repoId: $input.repository
          expr: |
            "/api/v2/firewall/components/\($repoMgrId)/\($repoId)/evaluate"

      # Step 5: POST to IQ Firewall evaluate
      - id: iqEval
        kind: http
        spec:
          extra_upstream: sonatypeiq
          method: POST
          path: $iqPath
          parse: json
          body: $iqBody

      # Step 6: Index IQ results by packageUrl
      # Waived violations: waiveTime != null (no explicit "waived" boolean).
      - id: iqIndex
        kind: jq
        spec:
          from: $iqEval
          expr: |
            [.results[]?
            | select(.component.packageUrl != null)
            | {
                packageUrl: .component.packageUrl,
                quarantined,
                maxThreat: (
                  [.policyViolations[]? | select(.waiveTime == null) | .threatLevel]
                  | max // 0
                ),
                activeViolationCount: (
                  [.policyViolations[]? | select(.waiveTime == null)] | length
                ),
                violations: [
                  .policyViolations[]? | select(.waiveTime == null)
                  | { policyName, threatLevel, policyViolationId, constraintViolations }
                ]
              }
            ]

      # Step 7: Merge verdicts → safeVersions + blockedVersions
      # "deny" = quarantined=true OR active threat >= minThreatLevel.
      # Candidates not in IQ results default to allow (quarantined=false, threat=0).
      - id: result
        kind: return
        spec:
          from: $candidates
          vars:
            groupId: $input.mavenGroupId
            artifactId: $input.mavenArtifactId
            repo: $input.repository
            repoMgrId: $input.repositoryManagerId
            limit: $input.limit
            minThreat: $input.minThreatLevel
            iqIndex: $iqIndex
          expr: |
            ([.[]
            | . as $c
            | (
                ($iqIndex[] | select(.packageUrl == $c.packageUrl))
                // { quarantined: false, maxThreat: 0, violations: [], activeViolationCount: 0 }
              ) as $iq
            | $c + {
                quarantined: $iq.quarantined,
                maxPolicyThreat: $iq.maxThreat,
                activeViolationCount: $iq.activeViolationCount,
                violations: $iq.violations,
                firewallStatus: (
                  if $iq.quarantined or ($iq.maxThreat >= ($minThreat // 1))
                  then "deny"
                  else "allow"
                  end
                )
              }
            ]) as $annotated
            | {
                coordinate: "\($groupId):\($artifactId)",
                repository: $repo,
                repositoryManagerId: $repoMgrId,
                minThreatLevel: ($minThreat // 1),
                summary: {
                  totalCandidates: ($annotated | length),
                  iqEvaluated: ($iqIndex | length),
                  iqMatched:
                    ([$annotated[]
                    | select(.maxPolicyThreat > 0 or .quarantined == true)]
                    | length),
                  safeCount:
                    ([$annotated[] | select(.firewallStatus == "allow")] | length),
                  blockedCount:
                    ([$annotated[] | select(.firewallStatus == "deny")] | length)
                },
                safeVersions:
                  [$annotated[] | select(.firewallStatus == "allow")
                  | { group, name, version, repository, downloadUrl, firewallStatus,
                      quarantined, maxPolicyThreat, activeViolationCount }
                  ]
                  | .[:($limit // 5)],
                blockedVersions:
                  [$annotated[] | select(.firewallStatus == "deny")
                  | { version, firewallStatus, quarantined, maxPolicyThreat,
                      activeViolationCount, violations }
                  ]
              }
