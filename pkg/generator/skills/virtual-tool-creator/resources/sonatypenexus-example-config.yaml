# nexus-mcp MCP server configuration — generated by mcpfather (https://github.com/flowgent-labs/mcpfather)
# Place this file at: $HOME/.nexus-mcp/config.yaml
# Environment variables with MCP__ prefix override these values.
# e.g. MCP__AUTH__BACKEND__OIDC__CLIENT_ID overrides auth.backend.oidc.client_id

# ---- Upstream API endpoint ----
upstream:
  endpoint: ""               # upstream API base URL (e.g. https://api.example.com)
  # When true, the MCP session ID is forwarded as X-MCP-Session-ID header.
  enable_mcp_session_forward: true

# ---- Runtime settings ----
runtime:
  download_dir: ""             # override download directory for binary responses
  log_authorization: false     # set true to print Authorization header values in logs

# ---- Management Endpoints (metrics, tracing, pprof) ----
mgmt:
  enabled: true
  host: 0.0.0.0
  port: 9991
  pprof:
    enabled: false
    server_bind: 0.0.0.0:6669
  otel:
    enabled: false
    endpoint: localhost:4317
    protocol: grpc             # grpc | http/protobuf | http/json
    timeout: 10000             # connection timeout in milliseconds
    sample_rate: 1.0           # 0.0–1.0 trace sampling ratio
  metrics:
    enabled: true
    prometheus: true
    export_interval: 30s
    histogram_boundaries:
      task: [0.005, 0.01, 0.025, 0.05, 0.1, 0.25, 0.5, 1, 2.5, 5, 10, 30, 60, 120]
    labels: {}                 # static labels added to every metric

# ---- Authentication ----
# frontend = inbound: validates bearer tokens presented by MCP clients (AI agents).
# backend  = outbound: credentials the server uses to call upstream APIs.
# The two are independent — the inbound token is never reused outbound
# (see MCP Authorization spec: Token Passthrough Prohibition).
auth:
  frontend:
    # Standard OAuth 2.1 / OIDC JWT bearer validation (Resource Server role, RFC 9728).
    # Only enforced on the http transport; stdio has no network boundary.
    oidc:
      enabled: false
      issuer: ""            # e.g. https://idp.example.com/realms/myrealm
      jwks_uri: ""          # optional override (auto-discovered from issuer if empty)
      audience: ""          # expected JWT "aud" claim; also published as the RFC 9728 protected-resource identifier
      # When true, validated frontend JWT claims (sub, email) are forwarded upstream
      # as X-MCP-Client-Token-Sub and X-MCP-Client-Token-Email headers.
      enable_client_token_claim_forward: true
      # Additional JWT claims to forward as X-MCP-Client-Token-<Header-Name> headers.
      # e.g. ["given_name", "family_name", "preferred_username"]
      # additional_client_token_claim_forward: []

  backend:
    # OIDC client credentials flow (machine-to-machine)
    oidc:
      enabled: false
      issuer: ""            # e.g. https://keycloak.example.com/realms/myrealm
      client_id: ""
      client_secret: ""
      scopes: "openid"       # space-separated scope list
      token_url: ""          # optional override (auto-discovered from issuer if empty)

    # Static credentials for legacy / simple APIs
    static:
      web_token: ""           # static web token (Bearer / Basic / raw)
      web_token_file: ""       # path to file containing web token (K8s secrets)
      cookie_token: ""        # static cookie (e.g. JSESSIONID for legacy systems)
      cookie_token_file: ""   # path to file containing cookie token (K8s secrets)

# ---- Native MCP Tools ----
nativeTools:
  expose:
    register_all_tools_by_default: false
    includes:
      - ListSearch
    excludes: []

# ---- Virtual Tools ----
# Compose multiple native tools into a single virtual tool via a declarative
# pipeline (call -> jq -> foreach -> emit -> return).
# Schema: https://github.com/flowgent-labs/mcpfather/blob/main/.agents/skills/virtual-tool-creator/resources/dsl-schema.json
#
# Real Enterprise Virtual Tools definitions:
#   - sonarqube-example-config.yaml
#     https://github.com/flowgent-labs/mcpfather/blob/main/.agents/skills/virtual-tool-creator/resources/sonarqube-example-config.yaml
#   - sonatypeiq-example-config.yaml
#     https://github.com/flowgent-labs/mcpfather/blob/main/.agents/skills/virtual-tool-creator/resources/sonatypeiq-example-config.yaml
virtualTools:
  # =========================================================================
  # Basic Edition — top 5 versions, single call, for fixer agent FOSS remediation
  # =========================================================================
  - name: maven_top5_versions
    enabled: true
    description: >
      Resolve the top 5 versions (latest first) for a Maven artifact given
      its groupId and artifactId. Returns version list plus component metadata
      in a single call. Designed for fixer agents performing autonomous FOSS
      remediation — no quarantine filtering.

    annotations:
      readOnlyHint: true
      destructiveHint: false
      idempotentHint: true
      openWorldHint: true

    inputSchema:
      type: object
      required:
        - mavenGroupId
        - mavenArtifactId
      properties:
        mavenGroupId:
          type: string
          description: Maven group ID, e.g. "com.fasterxml.jackson.core".
        mavenArtifactId:
          type: string
          description: Maven artifact ID, e.g. "jackson-databind".

    pipeline:
      - id: search
        kind: call
        spec:
          tool: ListSearch
          parse: json
          args:
            maven.groupId: $input.mavenGroupId
            maven.artifactId: $input.mavenArtifactId
            format: maven2
            sort: version
            direction: desc

      - id: top5
        kind: jq
        spec:
          from: $search
          expr: |
            [.items[:5] | .[] | {
              group,
              name,
              version,
              repository,
              downloadUrl: (.assets[0].downloadUrl // null)
            }]

      - id: result
        kind: return
        spec:
          from: $top5
          vars:
            groupId: $input.mavenGroupId
            artifactId: $input.mavenArtifactId
          expr: |
            {
              coordinate: "\($groupId):\($artifactId)",
              totalFound: (. | length),
              versions: [.[] | .version],
              components: .
            }

  # =========================================================================
  # Enterprise Edition — top 5 non-quarantined versions for fixer agents
  # =========================================================================
  - name: maven_top5_versions_safe
    enabled: true
    description: >
      Enterprise edition: resolve the top 5 non-quarantined versions for a
      Maven artifact. Filters out components that are quarantined, blocked by
      Firewall policies, or whose assets are inaccessible. Designed for fixer
      agents that must only recommend safe upgrades in enterprise environments.

    annotations:
      readOnlyHint: true
      destructiveHint: false
      idempotentHint: true
      openWorldHint: true

    inputSchema:
      type: object
      required:
        - mavenGroupId
        - mavenArtifactId
        - repository
      properties:
        mavenGroupId:
          type: string
          description: Maven group ID, e.g. "com.fasterxml.jackson.core".
        mavenArtifactId:
          type: string
          description: Maven artifact ID, e.g. "jackson-databind".
        repository:
          type: string
          description: >
            Repository name (required). Scope search to a specific repository
            to benefit from Firewall quarantine filtering.

    pipeline:
      - id: search
        kind: call
        spec:
          tool: ListSearch
          parse: json
          args:
            maven.groupId: $input.mavenGroupId
            maven.artifactId: $input.mavenArtifactId
            format: maven2
            sort: version
            direction: desc
            repository: $input.repository

      - id: safeTop5
        kind: jq
        spec:
          from: $search
          expr: |
            [
              .items[]
              | select(
                  (.assets | length > 0)
                  and (.assets[0].downloadUrl != null)
                  and (.assets[0].downloadUrl != "")
                  and (
                    (.assets[0].blobStoreName // "" | ascii_downcase | test("quarantine"))
                    | not
                  )
                )
            ]
            | .[:5]
            | [.[] | {
                group,
                name,
                version,
                repository,
                downloadUrl: .assets[0].downloadUrl
              }]

      - id: result
        kind: return
        spec:
          from: $safeTop5
          vars:
            groupId: $input.mavenGroupId
            artifactId: $input.mavenArtifactId
            repo: $input.repository
          expr: |
            {
              coordinate: "\($groupId):\($artifactId)",
              repository: $repo,
              safeVersionCount: (. | length),
              versions: [.[] | .version],
              components: .
            }
