apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sonarqube-mcp.fullname" . }}-config
  labels:
    {{- include "sonarqube-mcp.labels" . | nindent 4 }}
data:
  config.yaml: |
    # MCP server configuration — generated by mcpfather

    server:
      auth:
        oidc:
          enabled: {{ .Values.config.server.auth.oidc.enabled }}
          issuer: {{ .Values.config.server.auth.oidc.issuer | quote }}
          jwks_uri: {{ .Values.config.server.auth.oidc.jwksUri | quote }}
          audience: {{ .Values.config.server.auth.oidc.audience | quote }}
          enable_client_token_claim_forward: {{ .Values.config.server.auth.oidc.enableClientTokenClaimForward }}
          additional_client_token_claim_forward:
            {{- range .Values.config.server.auth.oidc.additionalClientTokenClaimForward }}
            - {{ . | quote }}
            {{- end }}
      max_parallel_requests: {{ .Values.config.server.max_parallel_requests }}

    upstream:
      default:
        endpoint: {{ .Values.config.upstream.default.endpoint | quote }}
        enable_mcp_session_forward: {{ .Values.config.upstream.default.enableMCPSessionForwarding }}
        auth:
          oidc:
            enabled: {{ .Values.config.upstream.default.auth.oidc.enabled }}
            issuer: {{ .Values.config.upstream.default.auth.oidc.issuer | quote }}
            client_id: {{ .Values.config.upstream.default.auth.oidc.clientId | quote }}
            scopes: {{ .Values.config.upstream.default.auth.oidc.scopes | quote }}
            token_url: {{ .Values.config.upstream.default.auth.oidc.tokenUrl | quote }}
            client_secret: ""   # set via MCP__UPSTREAM__DEFAULT__AUTH__OIDC__CLIENT_SECRET env (from Secret)

          static:
            web_token: ""    # set via MCP__UPSTREAM__DEFAULT__AUTH__STATIC__WEB_TOKEN env (from Secret)
            cookie_token: ""    # set via MCP__UPSTREAM__DEFAULT__AUTH__STATIC__COOKIE_TOKEN env (from Secret)

    nativeTools:
      expose:
        register_all_tools_by_default: {{ .Values.config.tools.registerAllByDefault }}
        includes:
          {{- range .Values.config.tools.includes }}
          - {{ . | quote }}
          {{- end }}
        excludes:
          {{- range .Values.config.tools.excludes }}
          - {{ . | quote }}
          {{- end }}

    mgmt:
      enabled: {{ .Values.config.mgmt.enabled }}
      host: "0.0.0.0"
      port: {{ .Values.service.mgmtPort }}
      otel:
        enabled: {{ .Values.config.mgmt.otel.enabled }}
        endpoint: {{ .Values.config.mgmt.otel.endpoint | quote }}
        protocol: {{ .Values.config.mgmt.otel.protocol | quote }}
        timeout: 10000
        sample_rate: {{ .Values.config.mgmt.otel.sampleRate }}
      metrics:
        enabled: {{ .Values.config.mgmt.metrics.enabled }}
        prometheus: {{ .Values.config.mgmt.metrics.prometheus }}
        export_interval: "30s"

    runtime:
      log_authorization: {{ .Values.config.runtime.logAuthorization }}
      download_dir: {{ .Values.config.runtime.downloadDir | default "" | quote }}

    virtualTools:
        {{- toYaml .Values.config.virtualTools | nindent 6 }}
