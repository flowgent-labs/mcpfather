# nexus-mcp MCP server configuration — generated by mcpfather (https://github.com/flowgent-labs/mcpfather)
# Place this file at: $HOME/.nexus-mcp/config.yaml
# Environment variables with MCP__ prefix override these values.
# e.g. MCP__UPSTREAM__DEFAULT__AUTH__OIDC__CLIENT_ID overrides upstream.default.auth.oidc.client_id
#
# Config format migration note (nexus-mcp v2+):
#   "upstream:" is now a map keyed by name (e.g. "default", "sonatypeiq").
#   "auth:" has been split into "server.auth:" (frontend/inbound)
#   and "upstream.<name>.auth:" (backend/outbound).

# ---- Server (inbound auth) ----
server:
  auth:
    oidc:
      enabled: false
      issuer: ""
      jwks_uri: ""
      audience: ""
      enable_client_token_claim_forward: true
  max_parallel_requests: 100

# ---- Upstream (outbound) ----
# Map keyed by name. "default" is the primary upstream for native tools.
# Additional keys (e.g. "sonatypeiq") are referenced by http pipeline steps
# via the upstream field.
upstream:
  default:
    endpoint: ""               # Nexus Repository API base URL (e.g. https://nexus.example.com)
    enable_mcp_session_forward: true
    auth:
      oidc:
        enabled: false
        issuer: ""
        client_id: ""
        client_secret: ""
        scopes: "openid"
        token_url: ""
      static:
        web_token: ""
        web_token_file: ""
        cookie_token: ""
        cookie_token_file: ""

  # Sonatype IQ Server — used by maven_top5_versions_safe to call
  # POST /api/v2/firewall/components/{repositoryManagerId}/{repositoryId}/evaluate
  # IQ REST API ref: https://help.sonatype.com/iqserver/automation/rest-api
  sonatypeiq:
    endpoint: ""               # IQ Server REST API base URL (e.g. https://iq.example.com)
    enable_mcp_session_forward: false
    auth:
      static:
        web_token: ""          # IQ REST API user token (Base64 user:pass or API key)
        web_token_file: ""
      oidc:
        enabled: false

# ---- Runtime settings ----
runtime:
  download_dir: ""
  log_authorization: false

# ---- Management Endpoints ----
mgmt:
  enabled: true
  host: 0.0.0.0
  port: 9991
  pprof:
    enabled: false
    server_bind: 0.0.0.0:6669
  otel:
    enabled: false
    endpoint: localhost:4317
    protocol: grpc
    timeout: 10000
    sample_rate: 1.0
  metrics:
    enabled: true
    prometheus: true
    export_interval: 30s
    histogram_boundaries:
      task: [0.005, 0.01, 0.025, 0.05, 0.1, 0.25, 0.5, 1, 2.5, 5, 10, 30, 60, 120]
    labels: {}

# ---- Native MCP Tools ----
nativeTools:
  expose:
    register_all_tools_by_default: false
    includes:
      - ListSearch
    excludes: []

# ---- Virtual Tools ----
# Compose multiple native tools into a single virtual tool via a declarative
# pipeline (call -> jq -> http -> foreach -> emit -> return).
# Schema: https://github.com/flowgent-labs/mcpfather/blob/main/.agents/skills/virtual-tool-creator/resources/dsl-schema.json
virtualTools:
  # =========================================================================
  # Basic Edition — top 5 versions, single call, for fixer agent FOSS remediation
  # =========================================================================
  - name: maven_top5_versions
    enabled: true
    description: >
      Resolve the top 5 versions (latest first) for a Maven artifact given
      its groupId and artifactId. Returns version list plus component metadata
      in a single call. Designed for fixer agents performing autonomous FOSS
      remediation — no quarantine filtering.

    annotations:
      readOnlyHint: true
      destructiveHint: false
      idempotentHint: true
      openWorldHint: true

    inputSchema:
      type: object
      required:
        - mavenGroupId
        - mavenArtifactId
      properties:
        mavenGroupId:
          type: string
          description: Maven group ID, e.g. "com.fasterxml.jackson.core".
        mavenArtifactId:
          type: string
          description: Maven artifact ID, e.g. "jackson-databind".

    pipeline:
      - id: search
        kind: call
        spec:
          tool: ListSearch
          parse: json
          args:
            maven.groupId: $input.mavenGroupId
            maven.artifactId: $input.mavenArtifactId
            format: maven2
            sort: version
            direction: desc

      - id: top5
        kind: jq
        spec:
          from: $search
          expr: |
            [.items[:5] | .[] | {
              group,
              name,
              version,
              repository,
              downloadUrl: (.assets[0].downloadUrl // null)
            }]

      - id: result
        kind: return
        spec:
          from: $top5
          vars:
            groupId: $input.mavenGroupId
            artifactId: $input.mavenArtifactId
          expr: |
            {
              coordinate: "\($groupId):\($artifactId)",
              totalFound: (. | length),
              versions: [.[] | .version],
              components: .
            }

  # =========================================================================
  # Enterprise Edition — top N firewall-safe versions via IQ evaluation
  # =========================================================================
  - name: maven_top5_versions_safe
    enabled: true
    description: >
      Enterprise edition: resolve the top N non-blocked (firewall-safe) Maven
      artifact versions by evaluating candidates against Sonatype IQ Firewall.

      Pipeline:
        1. ListSearch → fetch candidate versions from Nexus Repository.
        2. Build IQ evaluate request with packageUrl + SHA1 hash per component.
           (Maven requires hash for IQ evaluation — extracted from Nexus
           asset checksums.)
        3. POST /api/v2/firewall/components/{repositoryManagerId}/{repositoryId}/evaluate
           against the "sonatypeiq" upstream.
        4. Index results by packageUrl, extracting: quarantined flag,
           threatLevel (active non-waived violations only — waived violations
           have non-null waiveTime).
        5. Merge + split into safeVersions (quarantined=false) and
           blockedVersions (quarantined=true or active threat ≥ minThreatLevel).

      Designed for fixer agents that must only recommend safe upgrades in
      enterprise environments with Firewall enforcement.

    annotations:
      readOnlyHint: true
      destructiveHint: false
      idempotentHint: true
      openWorldHint: true

    inputSchema:
      type: object
      required:
        - mavenGroupId
        - mavenArtifactId
        - repository
        - repositoryManagerId
      properties:
        mavenGroupId:
          type: string
          description: Maven group ID, e.g. "com.fasterxml.jackson.core".
        mavenArtifactId:
          type: string
          description: Maven artifact ID, e.g. "jackson-databind".
        repository:
          type: string
          description: >
            Nexus Repository name (for ListSearch) AND Sonatype IQ repository
            ID (path param in the firewall evaluate URL). In most setups these
            are the same name.
        repositoryManagerId:
          type: string
          description: >
            Sonatype IQ repository manager ID (path param). The identifier
            IQ uses for the connected Nexus Repository Manager instance
            (e.g. "nexus").
        limit:
          type: integer
          default: 5
          minimum: 1
          maximum: 50
          description: Maximum number of safe versions to return.
        fetchLimit:
          type: integer
          default: 20
          minimum: 1
          maximum: 50
          description: >
            Number of candidate versions to fetch from Nexus for IQ evaluation.
            Fetch more than `limit` to absorb blocked versions. If you
            consistently get fewer safe versions than `limit`, increase this.
        minThreatLevel:
          type: integer
          default: 1
          minimum: 0
          maximum: 10
          description: >
            Minimum IQ policy threat level (0–10) for a blocking verdict.
            Default 1: any active policy violation blocks. Set higher (e.g. 7)
            to only block on security-critical violations.

    pipeline:
      # ── Step 1: Query Nexus Repository for candidate versions ──
      - id: search
        kind: call
        spec:
          tool: ListSearch
          parse: json
          args:
            maven.groupId: $input.mavenGroupId
            maven.artifactId: $input.mavenArtifactId
            format: maven2
            sort: version
            direction: desc
            repository: $input.repository
        require:
          nonEmpty: true
          message: "No matching components found in repository."

      # ── Step 2: Extract top-N candidates, build packageUrl + extract SHA1 hash ──
      # IQ requires hash for Maven (hash-based format) to identify the exact
      # file content. Extracted from Nexus AssetXO.checksum.sha1.
      # The hash field in IQ API expects format: "sha1:<hex>".
      - id: candidates
        kind: jq
        spec:
          from: $search
          vars:
            fetchLimit: $input.fetchLimit
          expr: |
            [.items[:($fetchLimit // 20)] | .[] | {
              group,
              name,
              version,
              repository,
              downloadUrl: (.assets[0].downloadUrl // null),
              packageUrl:
                "pkg:maven/\(.group | gsub("\\."; "/"))/\(.name)@\(.version)",
              hash: (
                if (.assets[0].checksum.sha1 // "" | length > 0)
                then "sha1:\(.assets[0].checksum.sha1)"
                else null
                end
              )
            }]
        require:
          nonEmpty: true
          message: "No candidate versions extracted from search results."

      # ── Step 3: Build IQ evaluate request body ──
      # ApiRepositoryComponentEvaluationRequestList: { format, components }.
      # Each component: { packageUrl, hash }. Hash required for Maven.
      - id: iqBody
        kind: jq
        spec:
          from: $candidates
          expr: |
            {
              format: "maven2",
              components: [.[] | { packageUrl, hash } | select(.hash != null)]
            }

      # ── Step 4: Build the IQ API path (inline $ref not supported in http path) ──
      - id: iqPath
        kind: jq
        spec:
          vars:
            repoMgrId: $input.repositoryManagerId
            repoId: $input.repository
          expr: |
            "/api/v2/firewall/components/\($repoMgrId)/\($repoId)/evaluate"

      # ── Step 5: Call Sonatype IQ Firewall evaluate ──
      - id: iqEval
        kind: http
        spec:
          upstream: sonatypeiq
          method: POST
          path: $iqPath
          parse: json
          body: $iqBody

      # ── Step 6: Index IQ results by packageUrl ──
      # ApiRepositoryComponentEvaluationResultList.results[]:
      #   - quarantined: boolean — the firewall verdict
      #   - policyViolations[]: { threatLevel, waiveTime, policyName, ... }
      #     waived when waiveTime != null (no explicit "waived" boolean)
      - id: iqIndex
        kind: jq
        spec:
          from: $iqEval
          expr: |
            [.results[]?
            | select(.component.packageUrl != null)
            | {
                packageUrl: .component.packageUrl,
                quarantined,
                maxThreat: (
                  [.policyViolations[]?
                  | select(.waiveTime == null)
                  | .threatLevel]
                  | max // 0
                ),
                activeViolationCount: (
                  [.policyViolations[]?
                  | select(.waiveTime == null)]
                  | length
                ),
                violations: [
                  .policyViolations[]?
                  | select(.waiveTime == null)
                  | {
                      policyName,
                      threatLevel,
                      policyViolationId,
                      constraintViolations
                    }
                ]
              }
            ]

      # ── Step 7: Merge firewall verdicts and return structured result ──
      # Each candidate gets a firewallStatus derived from:
      #   quarantined=true          → "deny" (firewall actively blocked)
      #   active threat ≥ threshold → "deny" (policy violation triggers block)
      #   otherwise                 → "allow"
      - id: result
        kind: return
        spec:
          from: $candidates
          vars:
            groupId: $input.mavenGroupId
            artifactId: $input.mavenArtifactId
            repo: $input.repository
            repoMgrId: $input.repositoryManagerId
            limit: $input.limit
            minThreat: $input.minThreatLevel
            iqIndex: $iqIndex
          expr: |
            ([.[]
            | . as $c
            | (
                ($iqIndex[] | select(.packageUrl == $c.packageUrl))
                // { quarantined: false, maxThreat: 0, violations: [], activeViolationCount: 0 }
              ) as $iq
            | $c + {
                quarantined: $iq.quarantined,
                maxPolicyThreat: $iq.maxThreat,
                activeViolationCount: $iq.activeViolationCount,
                violations: $iq.violations,
                firewallStatus: (
                  if $iq.quarantined or ($iq.maxThreat >= ($minThreat // 1))
                  then "deny"
                  else "allow"
                  end
                )
              }
            ]) as $annotated
            | {
                coordinate: "\($groupId):\($artifactId)",
                repository: $repo,
                repositoryManagerId: $repoMgrId,
                minThreatLevel: ($minThreat // 1),
                summary: {
                  totalCandidates: ($annotated | length),
                  iqEvaluated: ($iqIndex | length),
                  iqMatched:
                    ([$annotated[]
                    | select(.maxPolicyThreat > 0 or .quarantined == true)]
                    | length),
                  safeCount:
                    ([$annotated[] | select(.firewallStatus == "allow")] | length),
                  blockedCount:
                    ([$annotated[] | select(.firewallStatus == "deny")] | length)
                },
                safeVersions:
                  [$annotated[]
                  | select(.firewallStatus == "allow")
                  | {
                      group,
                      name,
                      version,
                      repository,
                      downloadUrl,
                      firewallStatus,
                      quarantined,
                      maxPolicyThreat,
                      activeViolationCount
                    }
                  ]
                  | .[:($limit // 5)],
                blockedVersions:
                  [$annotated[]
                  | select(.firewallStatus == "deny")
                  | {
                      version,
                      firewallStatus,
                      quarantined,
                      maxPolicyThreat,
                      activeViolationCount,
                      violations
                    }
                  ]
              }
