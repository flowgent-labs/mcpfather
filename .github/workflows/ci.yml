# CI workflow — triggered on PR lifecycle events (NOT on merge to main).
#
# Event matrix:
#   pull_request (opened, synchronize, reopened) → build + unit + integration tests
#   schedule (daily/weekly)                       → same, against main branch
#
# Deliberately NOT triggered by:
#   - push to main (merge commits are handled by release.yml)
#   - pull_request:closed (merged → release.yml; closed-without-merge is no-op)
#
# Concurrency: same PR/branch cancels the previous in-progress run.
#   group = ci-<pr-number> for PRs, ci-<ref> for scheduled runs.
#
# Integration tests (integration-it job):
#   The IT probe (00_prereqs_test.go, TestMain → autoSetup) auto-installs
#   kubectl + helm + k3s into ~/.local/mcpfather-it/ (cached via
#   actions/cache@v4, key: it-tools-${{ runner.os }}-v2) and starts a
#   lightweight k3s cluster if none is reachable. Deploy E2E tests run real
#   `helm install` + `kubectl get` assertions against that cluster. OIDC
#   tests (`TestServer_*`, `TestOIDC*`) auto-start a Keycloak Docker
#   container (ensureKeycloak). Tests skip gracefully when essential
#   infrastructure cannot be provisioned (no Docker, no sudo, etc.).
#
# IN_CN_GFW controls whether Docker builds route Go module traffic through
# goproxy.cn (China CDN) — false on CI runners (direct network).

name: Build & Test

on:
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    # Daily build on main branch (03:07 UTC)
    - cron: "7 3 * * *"
    # Weekly full integration test on main branch (Monday 08:37 UTC)
    - cron: "37 8 * * 1"

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  IN_CN_GFW: "false"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: make build

      - name: Unit Tests
        run: make test-ut

  integration-it:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: make build

      - name: Cache IT tools (kubectl, helm, k3s)
        uses: actions/cache@v4
        with:
          path: ~/.local/mcpfather-it
          key: it-tools-${{ runner.os }}-v2

      - name: Integration Tests
        run: make test-it
